<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fbf8f1"><title>Mes œuvres — Novelia</title>
<style>
:root{--bg:#fbf8f1;--panel:#f8f3e6;--line:#eee3cc;--text:#382b0b;--muted:#766744;--gold:#c3941c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Arial,sans-serif;padding-bottom:24px}header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}a{color:#76570e}header a{text-decoration:none;font-weight:bold}main{max-width:850px;margin:auto;padding:18px 14px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}h1{font-size:26px;margin:0}.btn,button{background:var(--gold);color:#2b210d;border:0;border-radius:9px;padding:10px 13px;text-decoration:none;font-weight:bold;cursor:pointer}.tabs{display:flex;margin-top:20px;border-bottom:1px solid var(--line)}.tab{flex:1;background:none;border-radius:0;color:var(--text);border-bottom:3px solid transparent}.tab[aria-selected=true]{border-bottom-color:#b87921}.count{background:#eee8db;border-radius:20px;padding:2px 7px;margin-left:4px}.card{display:grid;grid-template-columns:100px 1fr;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}.cover{width:100px;aspect-ratio:2/3;object-fit:cover;border-radius:8px;background:#eee5d3}.title{font-size:18px;font-weight:bold;margin:3px 0 8px}.meta{font-size:13px;color:var(--muted)}.badge{background:#eae5dc;border-radius:7px;padding:5px 9px;font-weight:bold;display:inline-block}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.secondary{background:#f2ead8;border:1px solid #d9cba9}.empty{padding:32px 10px;text-align:center;color:var(--muted);border:1px dashed #d9cba9;border-radius:12px;margin-top:15px}#status{color:var(--muted);font-size:13px}section[hidden]{display:none}@media(max-width:450px){.card{grid-template-columns:85px 1fr;gap:11px}.cover{width:85px}.title{font-size:16px}}
</style></head><body>
<header><a href="index.html">✦ NOVELIA</a><a href="author-dashboard.html">← Espace auteur</a></header>
<main><div class="top"><div><h1>Mes œuvres</h1><p class="meta">Gère tes histoires publiées et tes brouillons.</p></div><a class="btn" href="publish.html">＋ Nouvelle histoire</a></div><p id="status">Chargement…</p>
<div class="tabs"><button class="tab" id="pubTab" aria-selected="true">Publiées <span class="count" id="pubCount">0</span></button><button class="tab" id="draftTab" aria-selected="false">Brouillons <span class="count" id="draftCount">0</span></button></div>
<section id="pubPanel"><div id="pubList"></div></section><section id="draftPanel" hidden><div id="draftList"></div></section></main>
<script type="module">
import{createClient}from"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const db=createClient("https://czwaokqpqgrghxeeyguq.supabase.co","sb_publishable_ORoXM7DSfxdLF0jz8JRqqA_SISXCNsg");
const el=id=>document.getElementById(id);let stories=[];
function tab(pub){el("pubTab").setAttribute("aria-selected",String(pub));el("draftTab").setAttribute("aria-selected",String(!pub));el("pubPanel").hidden=!pub;el("draftPanel").hidden=pub}
el("pubTab").onclick=()=>tab(true);el("draftTab").onclick=()=>tab(false);
function card(s,draftCount=0,chapterCount=0){const box=document.createElement("article");box.className="card";const img=document.createElement("img");img.className="cover";img.alt="Couverture";img.src=s.cover_url||"";if(!s.cover_url)img.style.visibility="hidden";box.append(img);const body=document.createElement("div"),title=document.createElement("div");title.className="title";title.textContent=s.title||"Histoire sans titre";body.append(title);const badge=document.createElement("span");badge.className="badge";badge.textContent=s.status==="published"?chapterCount+" chapitre(s) publié(s)":draftCount+" brouillon(s)";body.append(badge);const actions=document.createElement("div");actions.className="actions";const edit=document.createElement("a");edit.className="btn secondary";edit.href="publish.html";edit.textContent="Modifier / chapitres";actions.append(edit);if(s.status==="published"){const read=document.createElement("a");read.className="btn";read.href="reader.html?db_story="+encodeURIComponent(s.id);read.textContent="Lire";actions.append(read)}body.append(actions);box.append(body);return box}
async function load(){const{data:{user}}=await db.auth.getUser();if(!user){el("status").textContent="Connecte-toi pour voir tes œuvres.";return}
const{data,error}=await db.from("stories").select("id,title,cover_url,status,moderation_hidden,created_at").eq("author_id",user.id).order("created_at",{ascending:false});if(error)throw error;stories=(data||[]).filter(s=>!s.moderation_hidden);
const ids=stories.map(s=>s.id);let chapters=[],drafts=[];if(ids.length){const a=await db.from("chapters").select("id,story_id,moderation_hidden").in("story_id",ids);if(a.error)throw a.error;chapters=(a.data||[]).filter(c=>!c.moderation_hidden);const b=await db.from("novelia_author_drafts").select("id,story_id").eq("author_id",user.id);if(b.error)throw b.error;drafts=b.data||[]}
const pc=stories.filter(s=>s.status==="published"),dc=stories.filter(s=>s.status!=="published");el("pubCount").textContent=pc.length;el("draftCount").textContent=dc.length+(drafts.filter(d=>!d.story_id).length);el("pubList").replaceChildren();el("draftList").replaceChildren();
for(const s of pc)el("pubList").append(card(s,0,chapters.filter(c=>c.story_id===s.id).length));for(const s of dc)el("draftList").append(card(s,drafts.filter(d=>d.story_id===s.id).length,chapters.filter(c=>c.story_id===s.id).length));
if(!pc.length)el("pubList").innerHTML='<div class="empty">Aucune histoire publiée pour le moment.</div>';if(!dc.length&&!drafts.some(d=>!d.story_id))el("draftList").innerHTML='<div class="empty">Aucun brouillon pour le moment.</div>';el("status").textContent="Tes œuvres sont à jour."}
load().catch(e=>{console.error(e);el("status").textContent="Erreur de chargement : "+e.message});
</script></body></html>
