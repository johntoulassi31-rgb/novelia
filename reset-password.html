<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nouveau mot de passe | Novelia</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#fbf8f1;color:#3b2c08;font-family:Arial,sans-serif}
    main{width:100%;max-width:420px;padding:28px;background:#f7f2e4;border:1px solid #e4dac1;border-radius:18px}
    h1{text-align:center;color:#7b5d12;margin-top:0}
    p{color:#655734;line-height:1.5}
    label{display:block;margin:16px 0 7px}
    input{width:100%;padding:13px;border-radius:9px;border:1px solid #d3c7a8;background:#fbf8f1;color:#2a2011;font-size:16px}
    button{width:100%;padding:13px;margin-top:16px;border:0;border-radius:9px;background:#be9429;color:#2a2011;font-weight:bold;font-size:16px}
    button:disabled{opacity:.6}
    #message{overflow-wrap:anywhere}
    a{color:#7b5d12}
  </style>
  <link rel="stylesheet" href="theme-gold.css">
</head>
<body>
  <main>
    <h1>Nouveau mot de passe</h1>
    <p id="intro">Vérification du lien de réinitialisation…</p>
    <form id="resetForm" hidden>
      <label for="password">Nouveau mot de passe</label>
      <input id="password" type="password" autocomplete="new-password" minlength="6" required placeholder="6 caractères minimum">
      <label for="confirmPassword">Confirmer le mot de passe</label>
      <input id="confirmPassword" type="password" autocomplete="new-password" minlength="6" required>
      <button id="saveButton" type="submit">Enregistrer le nouveau mot de passe</button>
    </form>
    <p id="message" role="status" aria-live="polite"></p>
    <p><a href="login.html">Retour à la connexion</a></p>
  </main>
  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.109.0/+esm";
    const supabase = createClient(
      "https://czwaokqpqgrghxeeyguq.supabase.co",
      "sb_publishable_ORoXM7DSfxdLF0jz8JRqqA_SISXCNsg"
    );
    const form = document.getElementById("resetForm");
    const intro = document.getElementById("intro");
    const message = document.getElementById("message");
    const saveButton = document.getElementById("saveButton");
    let recoveryAuthorized = false;

    const { data: listener } = supabase.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY" && session) {
        recoveryAuthorized = true;
        intro.textContent = "Choisis un nouveau mot de passe pour ton compte Novelia.";
        form.hidden = false;
        message.textContent = "";
      }
    });

    // Le lien doit provenir du flux de récupération Supabase, pas d'une simple session existante.
    window.addEventListener("load", async () => {
      await new Promise(resolve => setTimeout(resolve, 500));
      if (!recoveryAuthorized) {
        intro.textContent = "Ce lien est invalide ou a expiré.";
        message.textContent = "Retourne à la connexion et demande un nouveau lien de réinitialisation.";
      }
    });

    form.addEventListener("submit", async event => {
      event.preventDefault();
      if (!recoveryAuthorized) {
        message.textContent = "Aucun lien de récupération valide n'a été détecté.";
        return;
      }
      const password = document.getElementById("password").value;
      const confirmation = document.getElementById("confirmPassword").value;
      if (password.length < 6) {
        message.textContent = "Le mot de passe doit contenir au moins 6 caractères.";
        return;
      }
      if (password !== confirmation) {
        message.textContent = "Les deux mots de passe ne correspondent pas.";
        return;
      }
      saveButton.disabled = true;
      message.textContent = "Mise à jour du mot de passe…";
      try {
        const { error } = await supabase.auth.updateUser({ password });
        if (error) {
          message.textContent = "Impossible de modifier le mot de passe. Demande un nouveau lien et réessaie.";
          return;
        }
        recoveryAuthorized = false;
        form.hidden = true;
        intro.textContent = "Ton mot de passe a été modifié.";
        message.textContent = "Tu peux maintenant te connecter avec ton nouveau mot de passe.";
        await supabase.auth.signOut();
      } catch {
        message.textContent = "Une erreur réseau est survenue. Réessaie.";
      } finally {
        saveButton.disabled = false;
      }
    });

    window.addEventListener("beforeunload", () => listener.subscription.unsubscribe());
  </script>
<script src="./analytics.js" defer></script>
</body>
</html>
