name: Générer les pages histoires et le sitemap

on:
  schedule:
    - cron: "0 5 * * *"   # tous les jours à 05:00 UTC
  workflow_dispatch:        # lancement manuel possible (onglet Actions)
  push:
    paths:
      - "scripts/generate-stories.mjs"

permissions:
  contents: write

concurrency:
  group: generate-stories
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/generate-stories.mjs
      - name: Commit si changement
        run: |
          git config user.name "novelia-bot"
          git config user.email "novelia-bot@users.noreply.github.com"
          git add histoire sitemap.xml
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Mise à jour auto des pages histoires et du sitemap"
            git push
          fi
