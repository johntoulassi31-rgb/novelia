<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fbf8f1"><title>Administration des concours | Novelia</title><link rel="stylesheet" href="theme-gold.css"><style>
*{box-sizing:border-box}body{margin:0;background:#fbf8f1;color:#392b08;font:15px/1.5 Arial,sans-serif}header{padding:14px 18px;background:#f9f4ea;border-bottom:1px solid #eee3c9}a{color:#76570c}main{max-width:900px;margin:auto;padding:22px 16px 50px}h1{font-size:30px}h2{font-size:21px;margin-top:28px}.card{background:#f8f3e6;border:1px solid #eee3c9;border-radius:14px;padding:16px;margin:12px 0}.field{margin:10px 0}.field label{display:block;font-weight:bold;font-size:13px;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:10px;border:1px solid #dfd2b4;border-radius:8px;background:#fffdf8;font:inherit}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{padding:10px 13px;border:0;border-radius:8px;background:#c3941c;font-weight:bold;cursor:pointer;margin:4px}button.secondary{background:#e9dfc8}button:disabled{opacity:.6}.muted{color:#756746}.entry{border-top:1px solid #e5d9bd;padding:12px 0}@media(max-width:540px){.row{grid-template-columns:1fr}main{padding:14px 12px}}
</style></head><body><header><a href="contests.html">← Retour aux concours</a></header><main><h1>Administration des concours</h1><p id="status" class="muted">Vérification des droits…</p><section id="panel" hidden><h2>Créer un concours</h2><form id="create" class="card">
<div class="field"><label for="title">Titre</label><input id="title" required minlength="3" maxlength="120"></div>
<div class="field"><label for="slug">Identifiant URL (slug)</label><input id="slug" required pattern="[a-z0-9]+(-[a-z0-9]+)*" placeholder="exemple-concours"></div>
<div class="field"><label for="theme">Thème</label><input id="theme" required maxlength="160"></div>
<div class="row"><div class="field"><label for="category">Catégorie</label><select id="category"><option value="general">Général</option><option value="romance">Romance</option><option value="fantasy">Fantasy</option><option value="thriller">Thriller</option><option value="science_fiction">Science-fiction</option><option value="webtoon">Webtoon</option></select></div><div class="field"><label for="statusSelect">Publication</label><select id="statusSelect"><option value="draft">Brouillon</option><option value="open">Ouvrir les candidatures</option></select></div></div>
<div class="field"><label for="description">Description</label><textarea id="description" maxlength="5000"></textarea></div>
<div class="field"><label for="rules">Règles (une par ligne)</label><textarea id="rules" placeholder="Une œuvre publiée par auteur&#10;Respect du thème&#10;Respect des droits d’auteur"></textarea></div>
<div class="row"><div class="field"><label for="start">Ouverture des candidatures</label><input id="start" type="datetime-local"></div><div class="field"><label for="close">Clôture des candidatures</label><input id="close" type="datetime-local"></div></div>
<div class="row"><div class="field"><label for="voteStart">Début des votes</label><input id="voteStart" type="datetime-local"></div><div class="field"><label for="voteEnd">Fin des votes</label><input id="voteEnd" type="datetime-local"></div></div>
<div class="field"><label for="maxEntries">Participations maximum par auteur</label><select id="maxEntries"><option value="1">1 œuvre</option><option value="2">2 œuvres</option><option value="3">3 œuvres</option></select></div>
<button type="submit">Enregistrer le concours</button><p id="createMsg" class="muted"></p></form>
<h2>Concours publiés et brouillons</h2><div id="contestList"></div>
<h2>Attribuer les récompenses</h2><form id="awardForm" class="card"><div class="field"><label for="awardContest">Concours terminé</label><select id="awardContest" required><option value="">Choisir un concours…</option></select></div><div class="field"><label for="awardEntry">Œuvre lauréate</label><select id="awardEntry" required><option value="">Choisir une œuvre approuvée…</option></select></div><div class="field"><label for="awardType">Distinction</label><select id="awardType"><option value="grand_prix">Grand Prix Novelia</option><option value="prix_jury">Prix du jury</option><option value="prix_public">Prix du public</option><option value="coup_de_coeur">Coup de cœur du jury</option></select></div><div class="field"><label for="awardDescription">Récompense / accompagnement (facultatif)</label><textarea id="awardDescription" maxlength="1200" placeholder="Ex. mise en avant sur Novelia, entretien avec le jury, accompagnement éditorial…"></textarea></div><button type="submit">Attribuer la distinction</button><p id="awardMsg" class="muted"></p></form>
<h2>Candidatures à examiner</h2><div id="pendingList"></div></section></main>
<script type="module">
import{createClient}from"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.109.0/+esm";const db=createClient("https://czwaokqpqgrghxeeyguq.supabase.co","sb_publishable_ORoXM7DSfxdLF0jz8JRqqA_SISXCNsg"),$=id=>document.getElementById(id),el=(t,c,x)=>{const n=document.createElement(t);if(c)n.className=c;if(x!==undefined)n.textContent=x;return n;},iso=id=>$(id).value?new Date($(id).value).toISOString():null;
async function init(){const u=(await db.auth.getUser()).data?.user;if(!u){$("status").textContent="Connecte-toi avec un compte administrateur Novelia.";return;}const a=await db.rpc("novelia_is_admin");if(a.error||a.data!==true){$("status").textContent="Accès réservé aux administrateurs Novelia.";return;}$("status").textContent="Accès administrateur confirmé.";$("panel").hidden=false;await load();}
$("create").onsubmit=async e=>{e.preventDefault();const msg=$("createMsg");msg.textContent="Enregistrement…";const data={title:$("title").value.trim(),slug:$("slug").value.trim(),theme:$("theme").value.trim(),category:$("category").value,description:$("description").value.trim(),rules:$("rules").value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),status:$("statusSelect").value,starts_at:iso("start"),submissions_close_at:iso("close"),voting_starts_at:iso("voteStart"),voting_ends_at:iso("voteEnd"),max_entries_per_user:Number($("maxEntries").value),created_by:(await db.auth.getUser()).data.user.id};const r=await db.from("novelia_contests").insert(data);msg.textContent=r.error?"Erreur : "+r.error.message:"Concours enregistré.";if(!r.error){$("create").reset();await load();}};
async function load(){const [cs,es,approved]=await Promise.all([db.from("novelia_contests").select("*").order("created_at",{ascending:false}),db.from("novelia_contest_entries").select("id,contest_id,author_id,pitch,excerpt,submitted_at,stories(title)").eq("status","pending").order("submitted_at"),db.from("novelia_contest_entries").select("id,contest_id,author_id,stories(title)").eq("status","approved")]);const contestSelect=$("awardContest"),entrySelect=$("awardEntry");contestSelect.replaceChildren(new Option("Choisir un concours…",""));(cs.data||[]).filter(x=>x.status==="closed").forEach(x=>contestSelect.add(new Option(x.title,x.id)));const approvedRows=approved.data||[];function fillAwardEntries(){const cid=contestSelect.value;entrySelect.replaceChildren(new Option("Choisir une œuvre approuvée…",""));approvedRows.filter(x=>x.contest_id===cid).forEach(x=>entrySelect.add(new Option(x.stories?.title||"Œuvre",x.id)));}contestSelect.onchange=fillAwardEntries;fillAwardEntries();const cr=$("contestList");cr.replaceChildren();(cs.data||[]).forEach(c=>{const card=el("article","card");card.append(el("strong","",c.title),el("p","muted",c.status+" · "+c.slug));const row=el("div","");const open=el("button","secondary","Ouvrir les candidatures"),judge=el("button","secondary","Lancer le jugement"),vote=el("button","","Lancer les votes"),close=el("button","secondary","Clôturer");open.disabled=c.status==="open";open.onclick=()=>update(c.id,{status:"open"});judge.disabled=c.status==="judging";judge.onclick=()=>update(c.id,{status:"judging"});vote.disabled=c.status==="voting";vote.onclick=()=>update(c.id,{status:"voting"});close.disabled=c.status==="closed";close.onclick=()=>update(c.id,{status:"closed"});row.append(open,judge,vote,close);const jurorField=el("input","");jurorField.placeholder="UUID du membre à nommer juré";jurorField.autocomplete="off";const assign=el("button","secondary","Affecter au jury");assign.onclick=async()=>{const id=jurorField.value.trim();if(!/^[0-9a-f-]{36}$/i.test(id)){alert("Saisis un UUID de compte valide.");return;}const result=await db.from("novelia_contest_jurors").insert({contest_id:c.id,juror_id:id,assigned_by:(await db.auth.getUser()).data.user.id});if(result.error)alert("Affectation impossible : "+result.error.message);else alert("Membre ajouté au jury.");};const jurorWrap=el("div","field");jurorWrap.append(el("label","","Ajouter un juré (UUID du compte)"),jurorField,assign);card.append(row,jurorWrap);cr.append(card);});const er=$("pendingList");er.replaceChildren();if(es.error){er.append(el("p","muted","Impossible de charger les candidatures."));return;}if(!es.data?.length){er.append(el("p","muted","Aucune candidature en attente."));return;}for(const e of es.data){const card=el("div","card entry");card.append(el("strong","",e.stories?.title||"Œuvre"),el("p","muted",e.pitch||"Sans présentation"),el("p","muted",e.excerpt||"Sans extrait"));const ok=el("button","","Approuver"),no=el("button","secondary","Refuser");ok.onclick=()=>review(e.id,"approved");no.onclick=()=>review(e.id,"rejected");card.append(ok,no);er.append(card);}}
async function update(id,values){const r=await db.from("novelia_contests").update(values).eq("id",id);if(r.error)alert("Mise à jour impossible : "+r.error.message);await load();}
async function review(id,status){const r=await db.from("novelia_contest_entries").update({status,reviewed_at:new Date().toISOString()}).eq("id",id);if(r.error)alert("Modération impossible : "+r.error.message);await load();}
$("awardForm").onsubmit=async e=>{e.preventDefault();const msg=$("awardMsg");msg.textContent="Attribution…";const entry=await db.from("novelia_contest_entries").select("id,contest_id,author_id").eq("id",$("awardEntry").value).single();if(entry.error){msg.textContent="Œuvre introuvable.";return;}if(entry.data.contest_id!==$("awardContest").value){msg.textContent="Cette œuvre ne correspond pas au concours choisi.";return;}const result=await db.from("novelia_contest_awards").insert({contest_id:entry.data.contest_id,entry_id:entry.data.id,author_id:entry.data.author_id,award_type:$("awardType").value,prize_description:$("awardDescription").value.trim(),awarded_by:(await db.auth.getUser()).data.user.id});msg.textContent=result.error?"Attribution impossible : "+result.error.message:"Distinction attribuée et badge ajouté au profil du lauréat.";if(!result.error){$("awardDescription").value="";await load();}};
init();
</script></body></html>
