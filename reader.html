
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#100b18">
  <meta name="description" content="Découvre des romans et webtoons sur Novelia.">
  <title>Œuvre — Novelia</title>

  <style>
    :root {
      --bg: #100b18;
      --panel: #1b1326;
      --purple: #a855f7;
      --text: #f7f1ff;
      --muted: #b8a9c9;
      --border: #39234e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
      line-height: 1.7;
    }

    header {
      padding: 18px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    header a {
      color: #c4a5ff;
      text-decoration: none;
      font-weight: bold;
    }

    .container {
      width: min(850px, 100%);
      margin: auto;
      padding: 24px 16px 60px;
    }

    .back-link {
      display: inline-block;
      color: #d8b4fe;
      text-decoration: none;
      margin-bottom: 20px;
    }

    .book-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
    }

    .book-top {
      display: grid;
      grid-template-columns: minmax(110px, 220px) minmax(0, 1fr);
      gap: 20px;
      padding: 20px;
      align-items: start;
    }

    .cover {
      width: 100%;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      border-radius: 10px;
      background: linear-gradient(145deg, #392456, #7f1d3d, #100b18);
    }

    .cover-fallback {
      aspect-ratio: 2 / 3;
      border-radius: 10px;
      padding: 12px;
      display: flex;
      align-items: end;
      background: linear-gradient(145deg, #392456, #7f1d3d, #100b18);
      font: bold 21px Georgia, serif;
    }

    .eyebrow {
      color: #c4a5ff;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 11px;
      font-weight: bold;
    }

    h1 {
      font-size: clamp(25px, 6vw, 38px);
      line-height: 1.2;
      margin: 8px 0 12px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 14px 0;
    }

    .tag {
      background: #30203f;
      border: 1px solid #49345f;
      color: #e9d5ff;
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 12px;
    }

    .summary {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .button {
      border: 0;
      border-radius: 9px;
      padding: 12px 15px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      font-family: inherit;
    }

    .primary {
      background: var(--purple);
      color: white;
    }

    .secondary {
      background: #30203f;
      color: #e9d5ff;
      border: 1px solid #49345f;
    }

    .favorite-button {
      background: #30203f;
      color: #f0dfff;
      border: 1px solid #49345f;
    }

    .favorite-button.is-favorite {
      background: #4a1949;
      border-color: #c084fc;
      color: white;
    }

    .button:hover { filter: brightness(1.15); }

    .details {
      padding: 0 20px 20px;
      color: var(--muted);
      font-size: 13px;
    }

    .reader {
      margin-top: 28px;
      scroll-margin-top: 15px;
    }

    .chapter {
      padding: 22px;
      background: var(--panel);
      border-radius: 14px;
      border: 1px solid var(--border);
    }

    .chapter h2 {
      color: #d8b4fe;
      font-size: 21px;
      line-height: 1.4;
    }

    .reading-info {
      color: var(--muted);
      font-size: 13px;
      margin: 8px 0;
    }

    .progress-track {
      width: 100%;
      height: 7px;
      border-radius: 20px;
      background: #30203f;
      overflow: hidden;
      margin: 12px 0 22px;
    }

    .progress-fill {
      height: 100%;
      width: 0;
      background: var(--purple);
      transition: width 0.2s ease;
    }

    .novel-text {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      line-height: 2;
      overflow-wrap: anywhere;
    }

    .novel-text p { margin: 0 0 22px; }

    .webtoon-content {
      margin: 0 -22px;
      background: #09070e;
    }

    .webtoon-panel {
      background: #171020;
      border-bottom: 3px solid #09070e;
    }

    .webtoon-panel img {
      display: block;
      width: 100%;
      height: auto;
      min-height: 180px;
      object-fit: contain;
      background: #171020;
    }

    .panel-fallback {
      min-height: 220px;
      padding: 24px;
      text-align: center;
      background: linear-gradient(160deg, #291b39, #100b18);
      color: var(--muted);
    }

    .panel-fallback strong {
      display: block;
      color: #d8b4fe;
      font-size: 19px;
      margin-bottom: 8px;
    }

    .notice {
      margin-top: 20px;
      padding: 14px;
      border-left: 3px solid var(--purple);
      color: var(--muted);
      background: #1b1326;
      font-size: 14px;
    }

    .chapter-nav {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 20px;
    }

    .chapter-nav button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    [hidden] { display: none !important; }

    footer {
      text-align: center;
      padding: 20px;
      color: var(--muted);
      font-size: 13px;
      border-top: 1px solid var(--border);
    }

    @media (max-width: 520px) {
      .book-top {
        grid-template-columns: 110px minmax(0, 1fr);
        gap: 14px;
        padding: 14px;
      }

      .book-top h1 { font-size: 24px; }
      .summary { font-size: 13px; }
      .chapter { padding: 16px; }
      .webtoon-content { margin: 0 -16px; }
      .novel-text { font-size: 17px; }
      .details { padding: 0 14px 16px; }
      .button { padding: 11px 12px; }
    }

    @media (max-width: 360px) {
      .book-top { grid-template-columns: 1fr; }
      .cover, .cover-fallback { width: 65%; }
    }
  </style>
</head>

<body>
  <header>
    <a href="index.html">✦ NOVELIA</a>
    <a href="index.html#histoires">Toutes les œuvres</a>
  </header>

  <main class="container">
    <a class="back-link" href="index.html#histoires">
      ← Retour aux histoires
    </a>

    <section class="book-card" id="bookCard">
      <div class="book-top">
        <div>
          <img id="cover" class="cover" alt="" hidden>
          <div id="coverFallback" class="cover-fallback"></div>
        </div>

        <div>
          <div class="eyebrow" id="type">Œuvre Novelia</div>
          <h1 id="title">Chargement...</h1>

          <div class="meta">
            <span class="tag" id="genre"></span>
            <span class="tag" id="format"></span>
          </div>

          <p class="summary" id="description"></p>

          <div class="actions">
            <button class="button primary" id="startReading" type="button">
              Commencer la lecture
            </button>

            <button class="button primary" id="resumeReading"
              type="button" hidden>
              Reprendre la lecture
            </button>

            <button class="button favorite-button" id="favoriteButton"
              type="button" aria-pressed="false">
              ♡ Ajouter aux favoris
            </button>

            <a class="button secondary" href="index.html#histoires">
              Retour aux histoires
            </a>
          </div>

          <p class="summary" id="favoriteMessage"
            role="status" aria-live="polite"></p>

          <p class="summary" id="progressMessage"
            role="status" aria-live="polite"></p>
        </div>
      </div>

      <div class="details">
        <span id="chapterCount"></span>
        <span> · Présentation de démonstration</span>
      </div>
    </section>

    <section class="reader" id="reader" hidden>
      <div class="chapter">
        <div class="eyebrow" id="readingType">Lecture</div>
        <h2 id="chapterTitle"></h2>

        <p class="reading-info" id="chapterCounter"></p>

        <div class="progress-track"
          role="progressbar"
          aria-label="Progression de lecture"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
          id="progressTrack">
          <div class="progress-fill" id="progressFill"></div>
        </div>

        <div id="content"></div>

        <p class="reading-info" id="savedMessage" role="status"
          aria-live="polite"></p>

        <div class="chapter-nav">
          <button class="button secondary" id="previousChapter"
            type="button" disabled>
            ← Précédent
          </button>

          <button class="button secondary" id="nextChapter"
            type="button" disabled>
            Suivant →
          </button>
        </div>
      </div>
    </section>

    <p class="notice" id="errorMessage" hidden>
      Cette œuvre n’existe pas. Retourne à l’accueil pour en choisir une.
    </p>
  </main>

  <footer>Novelia · Chaque histoire mérite d’être racontée.</footer>

  <script>
    const stories = {
      roses: {
        title: "Les Roses de minuit",
        type: "Roman",
        genre: "Dark romance",
        cover: "images/roses.png",
        description: "Dans l'obscurité de la nuit, les secrets, les passions et les choix dangereux peuvent bouleverser plusieurs destins.",
        chapters: [
          {
            title: "Chapitre 1 — La première page",
            content: [
              "La nuit enveloppait la ville lorsque tout commença.",
              "Derrière les fenêtres éclairées, des secrets attendaient leur heure. Personne ne savait encore que cette rencontre allait bouleverser plusieurs destins.",
              "Fin de cet extrait de démonstration."
            ]
          },
          {
            title: "Chapitre 2 — Une rencontre inattendue",
            content: [
              "Le lendemain, une silhouette apparut au bout de la rue.",
              "Elle semblait chercher quelqu'un. Pourtant, lorsqu'elle croisa mon regard, elle détourna aussitôt les yeux.",
              "J'eus l'étrange impression que cette rencontre n'avait rien d'un hasard."
            ]
          },
          {
            title: "Chapitre 3 — Le secret",
            content: [
              "Un message anonyme m'attendait devant la porte.",
              "Quelques mots seulement, écrits d'une main tremblante : ne fais confiance à personne.",
              "Je compris alors que mon histoire ne faisait que commencer."
            ]
          }
        ]
      },

      lune: {
        title: "La Lune des oubliés",
        type: "Webtoon",
        genre: "Fantasy",
        cover: "images/lune.png",
        description: "Sous une lune mystérieuse, une ville semble cacher des secrets oubliés. Une silhouette surgit dans la nuit et tout pourrait bientôt changer.",
        chapters: [
          {
            title: "Épisode 1 — Le commencement",
            panels: [
              { image: "images/lune-1.png", text: "La ville sous la lune." },
              { image: "images/lune-2.png", text: "Une silhouette apparaît au loin." },
              { image: "images/lune-3.png", text: "Une rencontre inattendue." }
            ]
          },
          {
            title: "Épisode 2 — Les murmures de la nuit",
            panels: [
              { image: "images/lune-1.png", text: "La lune éclaire les rues désertes." },
              { image: "images/lune-2.png", text: "Un murmure semble venir de l'ombre." },
              { image: "images/lune-3.png", text: "La silhouette découvre un mystérieux symbole." }
            ]
          },
          {
            title: "Épisode 3 — Le passage oublié",
            panels: [
              { image: "images/lune-1.png", text: "Une porte apparaît dans la vieille ville." },
              { image: "images/lune-2.png", text: "Une lumière étrange traverse le passage." },
              { image: "images/lune-3.png", text: "Quelque chose attend de l'autre côté." }
            ]
          }
        ]
      },

      automne: {
        title: "Un automne pour nous",
        type: "Roman",
        genre: "Romance",
        cover: "images/automne.png",
        description: "Les feuilles tombent, les regards se croisent et une journée ordinaire prend une tournure inattendue.",
        chapters: [
          {
            title: "Chapitre 1 — Un jour d’automne",
            content: [
              "Les feuilles dansaient dans le vent lorsqu’ils se croisèrent pour la première fois.",
              "Un simple regard suffit à rendre cette journée différente des autres.",
              "Fin de cet extrait de démonstration."
            ]
          },
          {
            title: "Chapitre 2 — Un café pour deux",
            content: [
              "La pluie les força à se réfugier dans un petit café.",
              "Autour de deux tasses fumantes, les premières paroles remplacèrent les regards timides.",
              "Aucun des deux ne voulait être le premier à partir."
            ]
          },
          {
            title: "Chapitre 3 — Avant le départ",
            content: [
              "Le soleil déclinait déjà derrière les immeubles.",
              "Avant de partir, il lui tendit un morceau de papier sur lequel figurait un numéro.",
              "Elle sourit en comprenant qu'ils auraient une raison de se revoir."
            ]
          }
        ]
      },

      ville: {
        title: "La Ville sans ombre",
        type: "Webtoon",
        genre: "Mystère",
        cover: "images/ville.png",
        description: "Dans une ville silencieuse où quelque chose semble anormal, chaque rue dissimule peut-être un indice.",
        chapters: [
          {
            title: "Épisode 1 — Une ville étrange",
            panels: [
              { image: "images/ville-1.png", text: "Une ville silencieuse au petit matin." },
              { image: "images/ville-2.png", text: "Une rue où personne ne s’arrête." },
              { image: "images/ville-3.png", text: "Une porte s’ouvre dans l’obscurité." }
            ]
          },
          {
            title: "Épisode 2 — La rue interdite",
            panels: [
              { image: "images/ville-1.png", text: "Les rues semblent désertes." },
              { image: "images/ville-2.png", text: "Un panneau interdit l'accès à une ruelle." },
              { image: "images/ville-3.png", text: "Une ombre disparaît derrière une porte." }
            ]
          },
          {
            title: "Épisode 3 — Derrière la porte",
            panels: [
              { image: "images/ville-1.png", text: "La ville paraît retenir son souffle." },
              { image: "images/ville-2.png", text: "Un étrange symbole apparaît sur le mur." },
              { image: "images/ville-3.png", text: "La porte révèle un passage inconnu." }
            ]
          }
        ]
      }
    };

    const FAVORITES_KEY = "novelia_favorites";
    const PROGRESS_KEY = "novelia_progress";

    function readStorage(key, fallback) {
      try {
        const value = JSON.parse(localStorage.getItem(key) || "null");
        return value === null ? fallback : value;
      } catch (error) {
        return fallback;
      }
    }

    function loadFavorites() {
      const saved = readStorage(FAVORITES_KEY, []);
      return Array.isArray(saved)
        ? saved.filter(item => typeof item === "string")
        : [];
    }

    function saveFavorites(favorites) {
      try {
        localStorage.setItem(FAVORITES_KEY, JSON.stringify(favorites));
        return true;
      } catch (error) {
        return false;
      }
    }

    function loadProgress() {
      const saved = readStorage(PROGRESS_KEY, {});
      return saved && typeof saved === "object" && !Array.isArray(saved)
        ? saved
        : {};
    }

    function getSavedChapter(storyId, chapterTotal) {
      const progress = loadProgress();
      const entry = progress[storyId];

      if (!entry || !Number.isInteger(entry.chapter)) {
        return null;
      }

      if (entry.chapter < 0 || entry.chapter >= chapterTotal) {
        return null;
      }

      return entry.chapter;
    }

    function saveProgress(storyId, chapterIndex, chapterTotal) {
      try {
        const progress = loadProgress();

        progress[storyId] = {
          chapter: chapterIndex,
          total: chapterTotal,
          updatedAt: new Date().toISOString()
        };

        localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress));
        return true;
      } catch (error) {
        return false;
      }
    }

    const params = new URLSearchParams(window.location.search);
    const id = params.get("story");
    const story = stories[id];

    const cover = document.getElementById("cover");
    const coverFallback = document.getElementById("coverFallback");
    const reader = document.getElementById("reader");
    const content = document.getElementById("content");

    const favoriteButton = document.getElementById("favoriteButton");
    const favoriteMessage = document.getElementById("favoriteMessage");
    const progressMessage = document.getElementById("progressMessage");

    const startReadingButton = document.getElementById("startReading");
    const resumeReadingButton = document.getElementById("resumeReading");

    const previousButton = document.getElementById("previousChapter");
    const nextButton = document.getElementById("nextChapter");

    let currentChapter = 0;

    function updateFavoriteButton() {
      const favorites = loadFavorites();
      const isFavorite = favorites.includes(id);

      favoriteButton.classList.toggle("is-favorite", isFavorite);
      favoriteButton.setAttribute("aria-pressed", String(isFavorite));

      favoriteButton.textContent = isFavorite
        ? "♥ Retirer des favoris"
        : "♡ Ajouter aux favoris";
    }

    function updateResumeButton() {
      const savedChapter = getSavedChapter(id, story.chapters.length);

      resumeReadingButton.hidden = savedChapter === null;

      if (savedChapter !== null) {
        resumeReadingButton.textContent =
          "Reprendre la lecture — " +
          (story.type === "Roman" ? "chapitre " : "épisode ") +
          (savedChapter + 1);
      }
    }

    function updateProgressDisplay() {
      const percentage = Math.round(
        ((currentChapter + 1) / story.chapters.length) * 100
      );

      document.getElementById("progressFill").style.width =
        percentage + "%";

      const track = document.getElementById("progressTrack");
      track.setAttribute("aria-valuenow", String(percentage));

      document.getElementById("chapterCounter").textContent =
        (story.type === "Roman" ? "Chapitre " : "Épisode ") +
        (currentChapter + 1) + " sur " + story.chapters.length;

      previousButton.disabled = currentChapter === 0;
      nextButton.disabled = currentChapter === story.chapters.length - 1;
    }

    function renderNovelChapter(chapter) {
      content.className = "novel-text";
      content.replaceChildren();

      chapter.content.forEach(function(paragraphText) {
        const paragraph = document.createElement("p");
        paragraph.textContent = paragraphText;
        content.appendChild(paragraph);
      });
    }

    function renderWebtoonChapter(chapter) {
      content.className = "";
      content.replaceChildren();

      const webtoon = document.createElement("div");
      webtoon.className = "webtoon-content";

      chapter.panels.forEach(function(panelData, index) {
        const panel = document.createElement("section");
        panel.className = "webtoon-panel";

        const image = document.createElement("img");
        image.src = panelData.image;
        image.alt = story.title + " — case " + (index + 1);
        image.loading = "lazy";
        image.hidden = true;

        const fallback = document.createElement("div");
        fallback.className = "panel-fallback";

        const label = document.createElement("strong");
        label.textContent = "Case " + (index + 1);
        fallback.appendChild(label);

        const text = document.createElement("p");
        text.textContent = panelData.text;
        fallback.appendChild(text);

        image.addEventListener("load", function() {
          image.hidden = false;
          fallback.hidden = true;
        });

        image.addEventListener("error", function() {
          image.hidden = true;
          fallback.hidden = false;
        });

        panel.appendChild(image);
        panel.appendChild(fallback);
        webtoon.appendChild(panel);
      });

      content.appendChild(webtoon);

      const notice = document.createElement("p");
      notice.className = "notice";
      notice.textContent =
        "Les illustrations définitives pourront être ajoutées ultérieurement.";
      content.appendChild(notice);
    }

    function renderChapter(shouldSave) {
      const chapter = story.chapters[currentChapter];

      document.getElementById("chapterTitle").textContent = chapter.title;
      document.getElementById("readingType").textContent = story.type;

      if (story.type === "Roman") {
        renderNovelChapter(chapter);
      } else {
        renderWebtoonChapter(chapter);
      }

      updateProgressDisplay();

      if (shouldSave) {
        if (saveProgress(id, currentChapter, story.chapters.length)) {
          document.getElementById("savedMessage").textContent =
            "Progression enregistrée automatiquement.";
          updateResumeButton();
          progressMessage.textContent =
            "Ta progression est sauvegardée sur cet appareil.";
        } else {
          document.getElementById("savedMessage").textContent =
            "La sauvegarde est indisponible sur cet appareil.";
        }
      } else {
        document.getElementById("savedMessage").textContent = "";
      }
    }

    function openReader(chapterIndex) {
      currentChapter = chapterIndex;
      reader.hidden = false;

      renderChapter(true);

      reader.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    }

    if (!story) {
      document.title = "Œuvre introuvable — Novelia";
      document.getElementById("bookCard").hidden = true;
      document.getElementById("errorMessage").hidden = false;
    } else {
      document.title = story.title + " — Novelia";

      document.getElementById("title").textContent = story.title;
      document.getElementById("type").textContent = story.type;
      document.getElementById("genre").textContent = story.genre;

      document.getElementById("format").textContent =
        story.type === "Roman" ? "Lecture textuelle" : "Lecture illustrée";

      document.getElementById("description").textContent = story.description;

      document.getElementById("chapterCount").textContent =
        story.chapters.length +
        (story.type === "Roman" ? " chapitres de démonstration" :
          " épisodes de démonstration");

      cover.alt = "Couverture de " + story.title;
      cover.src = story.cover;
      coverFallback.textContent = story.title;

      cover.addEventListener("load", function() {
        cover.hidden = false;
        coverFallback.hidden = true;
      });

      cover.addEventListener("error", function() {
        cover.hidden = true;
        coverFallback.hidden = false;
      });

      updateFavoriteButton();
      updateResumeButton();

      const savedChapter = getSavedChapter(id, story.chapters.length);

      if (savedChapter !== null) {
        progressMessage.textContent =
          "Ta dernière lecture était au " +
          (story.type === "Roman" ? "chapitre " : "épisode ") +
          (savedChapter + 1) + ".";
      }

      favoriteButton.addEventListener("click", function() {
        const favorites = loadFavorites();
        const isFavorite = favorites.includes(id);

        const updatedFavorites = isFavorite
          ? favorites.filter(item => item !== id)
          : [...favorites, id];

        if (saveFavorites(updatedFavorites)) {
          updateFavoriteButton();

          favoriteMessage.textContent = isFavorite
            ? "Cette œuvre a été retirée de tes favoris."
            : "Cette œuvre a été ajoutée à tes favoris.";
        } else {
          favoriteMessage.textContent =
            "Impossible d'enregistrer ce changement sur cet appareil.";
        }
      });

      startReadingButton.addEventListener("click", function() {
        openReader(0);
      });

      resumeReadingButton.addEventListener("click", function() {
        const saved = getSavedChapter(id, story.chapters.length);
        openReader(saved === null ? 0 : saved);
      });

      previousButton.addEventListener("click", function() {
        if (currentChapter > 0) {
          currentChapter--;
          renderChapter(true);
          reader.scrollIntoView({ behavior: "smooth", block: "start" });
        }
      });

      nextButton.addEventListener("click", function() {
        if (currentChapter < story.chapters.length - 1) {
          currentChapter++;
          renderChapter(true);
          reader.scrollIntoView({ behavior: "smooth", block: "start" });
        }
      });
    }
  </script>
</body>
</html>
