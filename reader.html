
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#100b18">
  <title>Lecture — Novelia</title>

  <style>
    :root {
      --bg: #100b18;
      --panel: #1b1326;
      --purple: #a855f7;
      --text: #f7f1ff;
      --muted: #b8a9c9;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
      line-height: 1.8;
    }

    header {
      padding: 18px;
      background: var(--panel);
      border-bottom: 1px solid #39234e;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    header a {
      color: var(--purple);
      text-decoration: none;
      font-weight: bold;
    }

    .container {
      width: min(760px, 100%);
      margin: auto;
      padding: 24px 16px 60px;
    }

    .type {
      color: var(--purple);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 12px;
    }

    h1 {
      font-size: clamp(28px, 7vw, 42px);
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .description { color: var(--muted); }

    .chapter {
      margin-top: 32px;
      padding: 22px;
      background: var(--panel);
      border-radius: 14px;
      border: 1px solid #39234e;
    }

    .chapter h2 {
      color: #d8b4fe;
      font-size: 21px;
      line-height: 1.4;
    }

    .novel-text {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      line-height: 2;
      overflow-wrap: anywhere;
    }

    .novel-text p {
      margin: 0 0 22px;
      white-space: pre-line;
    }

    .webtoon-content {
      margin: 0 -22px;
      background: #09070e;
    }

    .webtoon-panel {
      position: relative;
      width: 100%;
      margin: 0;
      background: #171020;
      border-bottom: 3px solid #09070e;
    }

    .webtoon-panel img {
      display: block;
      width: 100%;
      height: auto;
      min-height: 180px;
      object-fit: contain;
      background: #171020;
    }

    .panel-fallback {
      min-height: 240px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #e9d5ff;
      background: linear-gradient(160deg, #291b39, #100b18);
    }

    .panel-fallback strong {
      display: block;
      color: #d8b4fe;
      font-size: 19px;
      margin-bottom: 8px;
    }

    .panel-fallback p {
      margin: 0;
      color: var(--muted);
    }

    .notice {
      margin-top: 20px;
      padding: 14px;
      border-left: 3px solid var(--purple);
      color: var(--muted);
      background: #1b1326;
      font-size: 14px;
    }

    .back {
      display: inline-block;
      margin-top: 25px;
      padding: 11px 18px;
      border-radius: 8px;
      background: var(--purple);
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: var(--muted);
      font-size: 13px;
      border-top: 1px solid #39234e;
    }

    @media (max-width: 480px) {
      .chapter { padding: 16px; }
      .webtoon-content { margin: 0 -16px; }
      .novel-text { font-size: 17px; }
    }
  </style>
</head>

<body>
  <header>
    <a href="index.html">✦ NOVELIA</a>
    <a href="index.html#histoires">Toutes les œuvres</a>
  </header>

  <main class="container">
    <div class="type" id="type">Lecture</div>

    <h1 id="title">Bienvenue sur Novelia</h1>

    <p class="description" id="description">
      Ton prochain univers commence ici.
    </p>

    <div class="chapter">
      <h2 id="chapterTitle">Présentation de l’œuvre</h2>
      <div id="content">
        <p>Sélectionne une œuvre depuis la page d’accueil.</p>
      </div>
    </div>

    <a class="back" href="index.html">← Retour à l’accueil</a>
  </main>

  <footer>
    Novelia · Chaque histoire mérite d’être racontée.
  </footer>

  <script>
    const stories = {
      roses: {
        title: "Les Roses de minuit",
        type: "Roman",
        description: "Une histoire à découvrir sur Novelia.",
        chapter: "Chapitre 1 — La première page",
        content: [
          "La nuit enveloppait la ville lorsque tout commença.",
          "Derrière les fenêtres éclairées, des secrets attendaient leur heure. Personne ne savait encore que cette rencontre allait bouleverser plusieurs destins.",
          "Fin de cet extrait de démonstration."
        ]
      },

      lune: {
        title: "La Lune des oubliés",
        type: "Webtoon",
        description: "Une histoire illustrée à découvrir.",
        chapter: "Épisode 1 — Le commencement",
        panels: [
          {
            image: "images/lune-1.png",
            text: "La ville sous la lune."
          },
          {
            image: "images/lune-2.png",
            text: "Une silhouette apparaît au loin."
          },
          {
            image: "images/lune-3.png",
            text: "Une rencontre inattendue."
          }
        ]
      },

      automne: {
        title: "Un automne pour nous",
        type: "Roman",
        description: "Une romance à découvrir sur Novelia.",
        chapter: "Chapitre 1 — Un jour d’automne",
        content: [
          "Les feuilles dansaient dans le vent lorsqu’ils se croisèrent pour la première fois.",
          "Un simple regard suffit à rendre cette journée différente des autres.",
          "Fin de cet extrait de démonstration."
        ]
      },

      ville: {
        title: "La Ville sans ombre",
        type: "Webtoon",
        description: "Un univers illustré plein de mystères.",
        chapter: "Épisode 1 — Une ville étrange",
        panels: [
          {
            image: "images/ville-1.png",
            text: "Une ville silencieuse au petit matin."
          },
          {
            image: "images/ville-2.png",
            text: "Une rue où personne ne s’arrête."
          },
          {
            image: "images/ville-3.png",
            text: "Une porte s’ouvre dans l’obscurité."
          }
        ]
      }
    };

    const params = new URLSearchParams(window.location.search);
    const id = params.get("story");
    const story = stories[id];
    const content = document.getElementById("content");

    if (story) {
      document.title = story.title + " — Novelia";

      document.getElementById("title").textContent = story.title;
      document.getElementById("type").textContent = story.type;
      document.getElementById("description").textContent =
        story.description;
      document.getElementById("chapterTitle").textContent =
        story.chapter;

      content.replaceChildren();

      if (story.panels) {
        const webtoon = document.createElement("div");
        webtoon.className = "webtoon-content";

        story.panels.forEach(function(panelData, index) {
          const panel = document.createElement("section");
          panel.className = "webtoon-panel";

          const image = document.createElement("img");
          image.src = panelData.image;
          image.alt = story.title + " — case " + (index + 1);
          image.loading = "lazy";

          const fallback = document.createElement("div");
          fallback.className = "panel-fallback";
          fallback.innerHTML =
            "<strong>Case " + (index + 1) + "</strong>";

          const text = document.createElement("p");
          text.textContent = panelData.text;
          fallback.appendChild(text);

          image.addEventListener("error", function() {
            image.hidden = true;
            fallback.hidden = false;
          });

          image.addEventListener("load", function() {
            fallback.hidden = true;
          });

          panel.appendChild(image);
          panel.appendChild(fallback);
          webtoon.appendChild(panel);
        });

        content.appendChild(webtoon);

        const notice = document.createElement("p");
        notice.className = "notice";
        notice.textContent =
          "Les illustrations de cet épisode seront affichées ici dès qu’elles seront disponibles.";
        content.appendChild(notice);

      } else {
        content.className = "novel-text";

        story.content.forEach(function(paragraphText) {
          const paragraph = document.createElement("p");
          paragraph.textContent = paragraphText;
          content.appendChild(paragraph);
        });
      }

    } else {
      document.title = "Œuvre introuvable — Novelia";

      document.getElementById("title").textContent =
        "Œuvre introuvable";
      document.getElementById("description").textContent =
        "Retourne à l’accueil et sélectionne une œuvre.";
      document.getElementById("chapterTitle").textContent =
        "Aucune lecture disponible";

      content.replaceChildren();

      const message = document.createElement("p");
      message.textContent =
        "Cette œuvre n’existe pas ou le lien est incorrect.";
      content.appendChild(message);
    }
  </script>
</body>
</html>
