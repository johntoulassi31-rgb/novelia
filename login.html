<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion | Novelia</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; background: #fbf8f1; color: #3b2c08; font-family: Arial, sans-serif; }
    .panel { width: 100%; max-width: 420px; padding: 28px; background: #f7f2e4; border: 1px solid #e4dac1; border-radius: 18px; }
    h1 { text-align: center; color: #7b5d12; margin-top: 0; }
    p { color: #655734; line-height: 1.5; }
    label { display: block; margin: 15px 0 7px; }
    input { width: 100%; padding: 13px; border-radius: 9px; border: 1px solid #d3c7a8; background: #fbf8f1; color: #2a2011; font-size: 16px; }
    button { width: 100%; padding: 13px; margin-top: 14px; border: 0; border-radius: 9px; background: #be9429; color: #2a2011; font-weight: bold; font-size: 16px; cursor: pointer; }
    button.secondary { background: #f1e7ce; }
    button:disabled { opacity: .6; cursor: wait; }
    #message { overflow-wrap: anywhere; margin-top: 16px; }
    a { color: #7b5d12; }
    .forgot { display:block; text-align:right; margin-top:10px; font-size:14px; }
    .social-divider{display:flex;align-items:center;gap:10px;margin:20px 0 6px;color:#806f4b;font-size:13px}.social-divider:before,.social-divider:after{content:"";height:1px;background:#dfd3b8;flex:1}
    .social-btn{background:#fff;border:1px solid #d8cba9;color:#302716}.social-btn.facebook{background:#eef3ff;border-color:#cbd8f0}.social-btn:disabled{opacity:.55}
  </style>
  <link rel="stylesheet" href="theme-gold.css">
</head>
<body>
  <main class="panel">
    <h1>Novelia</h1>
    <p>Connecte-toi pour retrouver ton univers de lecture.</p>
    <form id="authForm">
      <label for="username">Pseudonyme Novelia</label>
      <input id="username" type="text" minlength="3" maxlength="24" pattern="[A-Za-z0-9_]+" autocomplete="username" placeholder="Ex. PlumeObsidienne" required>
      <p style="font-size:13px;margin:6px 0 0">Obligatoire pour créer un compte : 3 à 24 caractères, lettres, chiffres ou _.</p>
      <label for="email">Adresse e-mail</label>
      <input id="email" type="email" autocomplete="email" placeholder="exemple@email.com" required>
      <label for="password">Mot de passe</label>
      <input id="password" type="password" autocomplete="current-password" minlength="6" placeholder="6 caractères minimum" required>
      <a class="forgot" href="#" id="forgotPassword">Mot de passe oublié ?</a>
      <label style="display:flex;gap:8px;align-items:flex-start;margin-top:14px;font-size:14px;line-height:1.4">
        <input id="ageConsent" type="checkbox" style="width:auto;margin-top:3px">
        <span>Pour créer un compte : j'ai au moins 16 ans et j'accepte la <a href="confidentialite.html">politique de confidentialité</a>.</span>
      </label>
      <button type="submit" id="loginBtn">Se connecter</button>
      <button type="button" class="secondary" id="signupBtn">Créer un compte</button>
      <div class="social-divider">OU AVEC UN RÉSEAU SOCIAL</div>
      <button type="button" class="social-btn" id="googleLogin">Continuer avec Google</button>
      <button type="button" class="social-btn facebook" id="facebookLogin">Continuer avec Facebook</button>
      <button type="button" class="social-btn" id="googleSignup">Créer un compte avec Google</button>
      <button type="button" class="social-btn facebook" id="facebookSignup">Créer un compte avec Facebook</button>
    </form>
    <p id="message" role="status" aria-live="polite"></p>
    <p><a href="./index.html">Retour à l’accueil</a></p>
  </main>
  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.109.0/+esm";
    const supabase = createClient(
      "https://czwaokqpqgrghxeeyguq.supabase.co",
      "sb_publishable_ORoXM7DSfxdLF0jz8JRqqA_SISXCNsg"
    );
    const form = document.getElementById("authForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const usernameInput = document.getElementById("username");
    const loginBtn = document.getElementById("loginBtn");
    const signupBtn = document.getElementById("signupBtn");
    const forgotBtn = document.getElementById("forgotPassword");
    const message = document.getElementById("message");
    const socialButtons = ["googleLogin","facebookLogin","googleSignup","facebookSignup"].map(id => document.getElementById(id));

    function showMessage(text) { message.textContent = text; }
    function setLoading(loading) {
      loginBtn.disabled = loading;
      signupBtn.disabled = loading;
      socialButtons.forEach(button => button.disabled = loading);
      forgotBtn.style.pointerEvents = loading ? "none" : "auto";
      forgotBtn.setAttribute("aria-disabled", String(loading));
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      const email = emailInput.value.trim();
      setLoading(true);
      showMessage("Connexion en cours...");
      try {
        const { error } = await supabase.auth.signInWithPassword({ email, password: passwordInput.value });
        if (error) {
          showMessage("Connexion impossible. Vérifie ton adresse e-mail et ton mot de passe.");
          return;
        }
        showMessage("Connexion réussie !");
        window.location.href = "./index.html";
      } catch {
        showMessage("Une erreur réseau est survenue. Réessaie.");
      } finally { setLoading(false); }
    });

    signupBtn.addEventListener("click", async () => {
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const username = usernameInput.value.trim();
      if (!/^[A-Za-z0-9_]{3,24}$/.test(username)) { showMessage("Choisis un pseudonyme de 3 à 24 caractères : lettres, chiffres ou _."); usernameInput.focus(); return; }
      if (!email) { showMessage("Entre ton adresse e-mail."); emailInput.focus(); return; }
      if (password.length < 6) { showMessage("Le mot de passe doit contenir au moins 6 caractères."); passwordInput.focus(); return; }
      if (!document.getElementById("ageConsent").checked) {
        showMessage("Confirme que tu as au moins 16 ans et accepte la politique de confidentialité.");
        return;
      }
      setLoading(true);
      showMessage("Création du compte en cours...");
      try {
        const { data, error } = await supabase.auth.signUp({
          email, password,
          options: { data: { username }, emailRedirectTo: "https://johntoulassi31-rgb.github.io/novelia/" }
        });
        if (error) { showMessage("Impossible de créer le compte. Vérifie les informations et réessaie."); return; }
        if (data.session) {
          showMessage("Compte créé. Redirection...");
          window.location.href = "./index.html";
        } else {
          showMessage("Inscription enregistrée. Consulte tes e-mails pour confirmer ton compte, puis connecte-toi.");
        }
      } catch { showMessage("Une erreur réseau est survenue. Réessaie."); }
      finally { setLoading(false); }
    });

    async function socialAuth(provider, creatingAccount) {
      if (creatingAccount) {
        const username = usernameInput.value.trim();
        if (!/^[A-Za-z0-9_]{3,24}$/.test(username)) {
          showMessage("Choisis un pseudonyme de 3 à 24 caractères : lettres, chiffres ou _.");
          usernameInput.focus();
          return;
        }
        localStorage.setItem("novelia_pending_signup_username", username);
      }
      if (creatingAccount && !document.getElementById("ageConsent").checked) {
        showMessage("Pour créer un compte, confirme que tu as au moins 16 ans et accepte la politique de confidentialité.");
        return;
      }
      setLoading(true);
      showMessage(creatingAccount ? "Préparation de la création du compte..." : "Connexion avec " + provider + "...");
      try {
        const { error } = await supabase.auth.signInWithOAuth({
          provider,
          options: {
            redirectTo: creatingAccount ? "https://johntoulassi31-rgb.github.io/novelia/profile.html" : "https://johntoulassi31-rgb.github.io/novelia/index.html",
            queryParams: { prompt: "select_account" }
          }
        });
        if (error) showMessage("Ce service n'est pas encore configuré. Réessaie plus tard.");
      } catch {
        showMessage("Impossible de démarrer la connexion sociale. Réessaie.");
      } finally { setLoading(false); }
    }
    document.getElementById("googleLogin").addEventListener("click", () => socialAuth("google", false));
    document.getElementById("facebookLogin").addEventListener("click", () => socialAuth("facebook", false));
    document.getElementById("googleSignup").addEventListener("click", () => socialAuth("google", true));
    document.getElementById("facebookSignup").addEventListener("click", () => socialAuth("facebook", true));

    forgotBtn.addEventListener("click", async event => {
      event.preventDefault();
      const email = emailInput.value.trim();
      if (!email) { showMessage("Entre d'abord ton adresse e-mail."); emailInput.focus(); return; }
      setLoading(true);
      showMessage("Envoi de la demande...");
      try {
        const { error } = await supabase.auth.resetPasswordForEmail(email, {
          redirectTo: "https://johntoulassi31-rgb.github.io/novelia/reset-password.html"
        });
        if (error) {
          showMessage("Impossible d'envoyer le lien pour le moment. Vérifie l'adresse et réessaie.");
        } else {
          showMessage("Si un compte correspond à cette adresse, un lien de réinitialisation vient d'être envoyé. Vérifie aussi tes courriers indésirables.");
        }
      } catch {
        showMessage("Une erreur réseau est survenue. Réessaie.");
      } finally { setLoading(false); }
    });
  </script>
<script src="./analytics.js" defer></script>
</body>
</html>
