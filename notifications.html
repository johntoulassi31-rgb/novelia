<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100d19">
  <title>Mes notifications — Novelia</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px 15px;
      background: #100d19; color: #f5f1ff;
      font-family: Arial, sans-serif;
    }
    main { width: 100%; max-width: 760px; margin: 20px auto; }
    .panel, .notification {
      background: #1c1729; border: 1px solid #382b50;
      border-radius: 15px; padding: 18px; margin-bottom: 14px;
    }
    h1, h2 { color: #c5a3ff; }
    h1 { margin-top: 0; }
    p { line-height: 1.5; }
    .muted { color: #c5bdd6; }
    .actions { display: flex; flex-wrap: wrap; gap: 9px; margin: 15px 0; }
    button, .link {
      display: inline-block; padding: 11px 15px; border: 0;
      border-radius: 9px; background: #9b6bff; color: white;
      font-weight: bold; text-decoration: none; cursor: pointer;
      font-size: 14px;
    }
    .secondary { background: #382b50; }
    button:disabled { opacity: .55; cursor: wait; }
    .notification { border-left: 4px solid #59466f; }
    .notification.unread { border-left-color: #b58aff; background: #241b36; }
    .notification-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .badge { font-size: 12px; border-radius: 99px; padding: 5px 9px; background: #382b50; color: #eee2ff; }
    .unread .badge { background: #6e42a8; }
    .notification-message { overflow-wrap: anywhere; }
    .notification-date { font-size: 12px; color: #b5a8c8; }
    #status { overflow-wrap: anywhere; }
    .error { color: #ffaaaa; }
    .success { color: #a9efbd; }
    .empty { padding: 22px 5px; text-align: center; color: #c5bdd6; }
    @media (min-width: 600px) { body { padding: 28px 20px; } .panel, .notification { padding: 22px; } }
  </style>
</head>
<body>
<main>
  <a class="link secondary" href="index.html">← Retour à Novelia</a>

  <section class="panel" style="margin-top:16px">
    <h1>Mes notifications</h1>
    <p class="muted">Retrouve ici les nouveaux abonnés et les chapitres publiés par les auteurs que tu suis.</p>
    <p id="accountStatus" class="muted" role="status">Vérification de la connexion…</p>
    <div class="actions">
      <button type="button" id="refreshButton">Actualiser</button>
      <button type="button" id="markAllButton" class="secondary">Tout marquer comme lu</button>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
  </section>

  <section>
    <h2>Récemment reçues <span id="unreadCount" class="muted"></span></h2>
    <div id="notificationList"><p class="empty">Chargement des notifications…</p></div>
  </section>
</main>

<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

  const supabase = createClient(
    "https://czwaokqpqgrghxeeyguq.supabase.co",
    "sb_publishable_ORoXM7DSfxdLF0jz8JRqqA_SISXCNsg"
  );
  const $ = id => document.getElementById(id);
  let currentUser = null;
  let notifications = [];
  let busy = false;

  function setStatus(text, kind = "") {
    $("status").textContent = text;
    $("status").className = kind;
  }

  function niceDate(value) {
    if (!value) return "Date inconnue";
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return "Date inconnue";
    return new Intl.DateTimeFormat("fr-FR", {
      dateStyle: "medium", timeStyle: "short"
    }).format(date);
  }

  function makeElement(tag, className, text) {
    const element = document.createElement(tag);
    if (className) element.className = className;
    if (text !== undefined) element.textContent = text;
    return element;
  }

  function renderNotifications() {
    const container = $("notificationList");
    container.replaceChildren();
    const unread = notifications.filter(item => !item.is_read).length;
    $("unreadCount").textContent = `(${unread} non lue${unread > 1 ? "s" : ""})`;
    $("markAllButton").disabled = busy || unread === 0;

    if (!notifications.length) {
      container.appendChild(makeElement("p", "empty", "Tu n’as pas encore de notification."));
      return;
    }

    notifications.forEach(item => {
      const card = makeElement("article", "notification" + (item.is_read ? "" : " unread"));
      const top = makeElement("div", "notification-top");
      const typeLabel = item.type === "new_follower" ? "Nouvel abonné" :
        item.type === "new_chapter" ? "Nouveau chapitre" : "Notification";
      top.appendChild(makeElement("strong", "", typeLabel));
      top.appendChild(makeElement("span", "badge", item.is_read ? "Lue" : "Non lue"));
      const message = makeElement("p", "notification-message", item.message || "Tu as une nouvelle notification.");
      const date = makeElement("p", "notification-date", niceDate(item.created_at));
      card.append(top, message, date);

      if (!item.is_read) {
        const button = makeElement("button", "secondary", "Marquer comme lue");
        button.type = "button";
        button.disabled = busy;
        button.addEventListener("click", () => markOneRead(item.id));
        card.appendChild(button);
      }
      container.appendChild(card);
    });
  }

  async function loadNotifications() {
    if (!currentUser) return;
    busy = true;
    $("refreshButton").disabled = true;
    $("markAllButton").disabled = true;
    setStatus("Chargement des notifications…");
    try {
      const { data, error } = await supabase
        .from("notifications")
        .select("id, recipient_id, actor_id, type, story_id, chapter_id, message, is_read, created_at")
        .eq("recipient_id", currentUser.id)
        .order("created_at", { ascending: false })
        .limit(100);
      if (error) throw error;
      notifications = data || [];
      setStatus(notifications.length ? "Notifications chargées." : "Aucune notification pour le moment.", "success");
    } catch (error) {
      notifications = [];
      setStatus("Impossible de charger les notifications : " + (error.message || "erreur inconnue."), "error");
    } finally {
      busy = false;
      $("refreshButton").disabled = false;
      renderNotifications();
    }
  }

  async function markOneRead(id) {
    if (busy || !currentUser) return;
    busy = true;
    renderNotifications();
    setStatus("Mise à jour…");
    try {
      const { data, error } = await supabase
        .from("notifications")
        .update({ is_read: true })
        .eq("id", id)
        .eq("recipient_id", currentUser.id)
        .select("id")
        .maybeSingle();
      if (error) throw error;
      if (!data) throw new Error("Aucune notification n’a été mise à jour. Vérifie les politiques RLS.");
      notifications = notifications.map(item => item.id === id ? { ...item, is_read: true } : item);
      setStatus("Notification marquée comme lue.", "success");
    } catch (error) {
      setStatus("Impossible de mettre à jour la notification : " + (error.message || "erreur inconnue."), "error");
    } finally {
      busy = false;
      renderNotifications();
    }
  }

  $("markAllButton").addEventListener("click", async () => {
    if (busy || !currentUser) return;
    const unreadIds = notifications.filter(item => !item.is_read).map(item => item.id);
    if (!unreadIds.length) return;
    busy = true;
    renderNotifications();
    setStatus("Mise à jour des notifications…");
    try {
      const { error } = await supabase
        .from("notifications")
        .update({ is_read: true })
        .eq("recipient_id", currentUser.id)
        .eq("is_read", false);
      if (error) throw error;
      notifications = notifications.map(item => ({ ...item, is_read: true }));
      setStatus("Toutes les notifications affichées sont marquées comme lues.", "success");
    } catch (error) {
      setStatus("Impossible de mettre à jour les notifications : " + (error.message || "erreur inconnue."), "error");
    } finally {
      busy = false;
      renderNotifications();
    }
  });

  $("refreshButton").addEventListener("click", loadNotifications);

  async function start() {
    const { data, error } = await supabase.auth.getUser();
    if (error || !data.user) {
      $("accountStatus").textContent = "Connecte-toi pour consulter tes notifications.";
      $("notificationList").replaceChildren(makeElement("p", "empty", "Redirection vers la connexion…"));
      setTimeout(() => { location.href = "login.html"; }, 800);
      return;
    }
    currentUser = data.user;
    $("accountStatus").textContent = "Connecté : " + (currentUser.email || "compte utilisateur");
    await loadNotifications();
  }

  start();
</script>
</body>
</html>
