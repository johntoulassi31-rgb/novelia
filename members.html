<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fbf8f1"><title>Communauté — Membres Novelia</title><meta name="description" content="Découvre les profils des lecteurs et auteurs de Novelia."><link rel="stylesheet" href="theme-gold.css"><style>
*{box-sizing:border-box}body{margin:0;background:#fbf8f1;color:#392b08;font-family:Arial,sans-serif}.top{position:sticky;top:0;z-index:5;padding:14px 18px;background:#fbf8f1ed;border-bottom:1px solid #f0e6cd;display:flex;justify-content:space-between;align-items:center}.top a{color:#7d5f12;text-decoration:none;font-weight:bold}main{max-width:900px;margin:auto;padding:20px 15px 100px}h1{margin:8px 0}.muted{color:#675937}.search{width:100%;padding:14px;border:1px solid #e6d9b9;border-radius:12px;background:white;font:inherit}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}.member{display:flex;align-items:center;gap:11px;padding:13px;background:#f8f3e6;border:1px solid #f0e6cd;border-radius:14px;min-width:0}.avatar{width:54px;height:54px;flex:0 0 54px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#d8bd6e,#8b6a1b);color:#fff;font-weight:bold;font-size:22px;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.member-info{min-width:0}.member h2{font-size:15px;margin:0 0 3px;overflow-wrap:anywhere}.member p{font-size:12px;margin:0;color:#675937;overflow-wrap:anywhere}.member a{display:inline-block;margin-top:7px;color:#7d5f12;font-size:12px;font-weight:bold;text-decoration:none}.status{padding:14px;color:#675937}@media(min-width:650px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:380px){.grid{grid-template-columns:1fr}}
</style></head><body><header class="top"><a href="index.html">✦ NOVELIA</a><a href="community.html">Communauté</a></header><main><p class="muted">LA COMMUNAUTÉ NOVELIA</p><h1>Tous les membres</h1><p class="muted">Découvre les lecteurs et auteurs, puis ouvre leur profil pour suivre leurs publications.</p><p id="status" class="status" role="status">Chargement des profils…</p><section class="grid" id="members" aria-live="polite"></section></main><script type="module">
import{createClient}from"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.109.0/+esm";const supabase=createClient("https://czwaokqpqgrghxeeyguq.supabase.co","sb_publishable_ORoXM7DSfxdLF0jz8JRqqA_SISXCNsg");const $=id=>document.getElementById(id);let profiles=[];
function render(){const rows=profiles;$("members").replaceChildren();if(!rows.length){$("members").textContent="Aucun membre pour le moment.";return}rows.forEach(p=>{const card=document.createElement("article");card.className="member";const av=document.createElement("div");av.className="avatar";if(p.avatar_url&&/^https?:\/\//i.test(p.avatar_url)){const img=document.createElement("img");img.src=p.avatar_url;img.alt="";img.onerror=()=>{av.textContent=(p.display_name||p.username||"?").charAt(0).toUpperCase()};av.append(img)}else av.textContent=(p.display_name||p.username||"?").charAt(0).toUpperCase();const info=document.createElement("div");info.className="member-info";const name=document.createElement("h2");name.textContent=p.display_name||p.username||"Membre Novelia";const username=document.createElement("p");username.textContent="@"+(p.username||"membre");const link=document.createElement("a");link.href="public-profile.html?username="+encodeURIComponent(p.username||"");link.textContent="Voir le profil →";info.append(name,username,link);card.append(av,info);$("members").append(card)});$("status").textContent=rows.length+" profil(s) affiché(s)."}
async function load(){try{let offset=0,batch=[];while(true){const{data,error}=await supabase.from("profiles").select("id,username,display_name,avatar_url,created_at").order("created_at",{ascending:false}).range(offset,offset+499);if(error)throw error;batch=data||[];profiles.push(...batch);if(batch.length<500)break;offset+=500;}render()}catch(e){$("status").textContent="Impossible de charger les profils : "+e.message}}load();
</script><script src="bottom-nav.js" defer></script></body></html>
