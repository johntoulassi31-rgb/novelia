<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbf8f1">
  <title>Profil public — Novelia</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #fbf8f1; color: #392b08; font-family: Arial, sans-serif; }
    a { color: inherit; }
    .topbar { padding: 14px 16px; }
    .back { color: #614b12; text-decoration: none; font-size: 14px; }
    .hero { text-align: center; padding: 8px 16px 20px;
      background: linear-gradient(180deg, #f4ebd8 0%, #fbf8f1 100%); }
    .avatar { width: 96px; height: 96px; border-radius: 50%; margin: 6px auto 12px;
      display: flex; align-items: center; justify-content: center; font-size: 38px; font-weight: bold;
      color: #1f1b14; background: linear-gradient(135deg, #c3941c, #926f15); border: 3px solid #392b0822; }
    h1 { margin: 0; font-size: 24px; overflow-wrap: anywhere; }
    .username { margin: 4px 0 0; color: #675937; }
    .stats { display: flex; justify-content: center; gap: 28px; margin: 18px 0 16px; }
    .stat strong { display: block; font-size: 22px; }
    .stat span { font-size: 12px; color: #675937; text-transform: uppercase; letter-spacing: .5px; }
    .btn { display: inline-block; padding: 11px 26px; border: 0; border-radius: 999px; background: #c3941c;
      color: #1f1b14; font-weight: bold; font-size: 15px; text-decoration: none; cursor: pointer; }
    .btn.secondary { background: #f1e7ce; }
    .btn:disabled { opacity: .6; cursor: wait; }
    #status { min-height: 20px; margin: 10px 0 0; overflow-wrap: anywhere; font-size: 14px; }
    .error { color: #7e0a0a; }
    .success { color: #188136; }
    .tabs { display: flex; gap: 8px; padding: 12px 16px; border-bottom: 1px solid #f0e6cd; overflow-x: auto; }
    .tab { flex: 0 0 auto; padding: 8px 16px; border-radius: 999px; border: 1px solid #f0e6cd;
      background: transparent; color: #675937; font-size: 14px; cursor: pointer; }
    .tab[aria-selected="true"] { background: #c3941c; border-color: #c3941c; color: #1f1b14; font-weight: bold; }
    main { max-width: 700px; margin: 0 auto; }
    #stories { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; padding: 16px; }
    @media (min-width: 560px) { #stories { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    .story { background: #f8f3e6; border: 1px solid #f0e6cd; border-radius: 14px; overflow: hidden;
      display: flex; flex-direction: column; text-decoration: none; }
    .cover { aspect-ratio: 2 / 3; width: 100%; object-fit: cover; display: block; background: #f9f4ea; }
    .cover.fallback { display: flex; align-items: center; justify-content: center; padding: 10px; text-align: center;
      font-weight: bold; background: linear-gradient(160deg, #eee2c5, #f7f2e4); }
    .info { padding: 10px 12px 14px; }
    .info h3 { margin: 0 0 4px; font-size: 15px; overflow-wrap: anywhere; }
    .muted { margin: 0; color: #675937; font-size: 13px; }
    .empty { grid-column: 1 / -1; color: #675937; text-align: center; padding: 24px 0; }
      .bio{max-width:520px;margin:10px auto 0;padding:0 16px;color:#5a4a2a;white-space:pre-line;overflow-wrap:anywhere}
    .avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
    .ambassador{display:inline-flex;align-items:center;gap:8px;margin:10px auto 0;padding:4px 16px 4px 6px;border-radius:999px;background:#fbf4de;border:1px solid #d4af37;font-weight:bold;color:#7a5c0e;font-size:14px}
    .ambassador img{width:44px;height:44px}
    [hidden]{display:none!important}
  </style>
<link rel="stylesheet" href="theme-gold.css">
</head>
<body>
<div class="topbar"><a class="back" href="index.html">← Accueil Novelia</a></div>

<header class="hero">
  <div class="avatar" id="avatar" aria-hidden="true">?</div>
  <h1 id="name">Profil public</h1>
  <p id="username" class="username">Chargement...</p>
  <p id="bio" class="bio" hidden></p>
  <div id="ambassador" class="ambassador" hidden><img src="images/badge-ambassadeur.png" alt="Badge Ambassadeur Novelia" width="44" height="44"><span>Ambassadeur Novelia</span></div>

  <div class="stats">
    <div class="stat"><strong id="statWorks">–</strong><span>Œuvres</span></div>
    <div class="stat"><strong id="statFollowers">–</strong><span>Abonnés</span></div>
    <div class="stat"><strong id="statFollowing">–</strong><span>Abonnements</span></div>
  </div>

  <button id="followButton" class="btn" type="button" hidden>S'abonner</button>
  <a id="editLink" class="btn secondary" href="profile.html" hidden>Modifier mon profil</a>
  <p id="status" role="status" aria-live="polite"></p>
  <p id="counts" hidden></p>
</header>

<div class="tabs" role="tablist" aria-label="Filtrer les histoires">
  <button class="tab" role="tab" aria-selected="true" data-filter="all">Tout</button>
  <button class="tab" role="tab" aria-selected="false" data-filter="roman">Romans</button>
  <button class="tab" role="tab" aria-selected="false" data-filter="webtoon">Webtoons</button>
</div>

<main>
  <div id="stories"><p class="empty">Chargement des histoires...</p></div>
</main>

<script type="module">
import { createClient } from
  "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.109.0/+esm";

const supabase = createClient(
  "https://czwaokqpqgrghxeeyguq.supabase.co",
  "sb_publishable_ORoXM7DSfxdLF0jz8JRqqA_SISXCNsg"
);

const $ = id => document.getElementById(id);

const params = new URLSearchParams(location.search);
const requestedUsername = (params.get("username") || "")
  .trim().replace(/^@/, "");

let profile = null;
let currentUser = null;
let following = false;
let loadingAction = false;

function message(text, type = "") {
  $("status").textContent = text;
  $("status").className = type;
}

let allStories = [];
let activeFilter = "all";

function initials(text) {
  const t = String(text || "?").trim();
  return (t[0] || "?").toUpperCase();
}

function safeImageUrl(url) {
  return /^https?:\/\//i.test(url || "") ? url : "";
}

function renderStories(stories) {
  if (stories) allStories = stories;
  const container = $("stories");
  container.replaceChildren();

  const list = allStories.filter(s =>
    activeFilter === "all" ||
    (activeFilter === "webtoon") === (s.story_type === "webtoon")
  );

  if (list.length === 0) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = allStories.length === 0
      ? "Cet auteur n'a pas encore publié d'histoire."
      : "Aucune histoire dans cette catégorie.";
    container.append(p);
    return;
  }

  list.forEach(story => {
    const card = document.createElement("a");
    card.className = "story";
    card.href = "reader.html?db_story=" + encodeURIComponent(story.id);

    const title = document.createElement("h3");
    title.textContent = story.title || "Sans titre";

    const cover = safeImageUrl(story.cover_url);
    function fallback() {
      const box = document.createElement("div");
      box.className = "cover fallback";
      box.textContent = story.title || "Sans titre";
      return box;
    }
    if (cover) {
      const img = document.createElement("img");
      img.className = "cover";
      img.src = cover;
      img.alt = "Couverture de " + (story.title || "l'histoire");
      img.loading = "lazy";
      img.addEventListener("error", () => img.replaceWith(fallback()));
      card.append(img);
    } else {
      card.append(fallback());
    }

    const info = document.createElement("div");
    info.className = "info";
    const meta = document.createElement("p");
    meta.className = "muted";
    meta.textContent =
      (story.story_type === "webtoon" ? "Webtoon" : "Roman") +
      " · " + (story.genre || "Autre");
    info.append(title, meta);
    card.append(info);
    container.append(card);
  });
}

document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    activeFilter = tab.dataset.filter;
    document.querySelectorAll(".tab").forEach(x =>
      x.setAttribute("aria-selected", String(x === tab)));
    renderStories();
  });
});

async function refreshFollowButton() {
  if (!profile) return;

  const button = $("followButton");

  // Profil personnel : impossible de s'abonner à soi-même.
  if (currentUser && currentUser.id === profile.id) {
    button.hidden = true;
    $("editLink").hidden = false;
    message("");
    return;
  }

  // Visiteur non connecté : proposer la connexion.
  button.hidden = false;

  if (!currentUser) {
    following = false;
    button.textContent = "Se connecter pour suivre";
    message("Connecte-toi pour t'abonner à cet auteur.");
    return;
  }

  button.textContent = "Vérification...";
  button.disabled = true;

  const { data, error } = await supabase
    .from("follows")
    .select("follower_id")
    .eq("follower_id", currentUser.id)
    .eq("followed_id", profile.id)
    .maybeSingle();

  button.disabled = false;

  if (error) {
    button.textContent = "Réessayer";
    message(
      "Impossible de vérifier l'abonnement : " + error.message,
      "error"
    );
    return;
  }

  following = Boolean(data);
  button.textContent = following ? "Se désabonner" : "S'abonner";
  message("");
}

async function loadPage() {
  $("followButton").hidden = true;
  message("Chargement du profil...");

  if (!requestedUsername) {
    $("name").textContent = "Profil introuvable";
    $("username").textContent =
      "Adresse incomplète : ajoute ?username=pseudonyme à l'URL.";
    $("stories").textContent = "";
    message("Aucun pseudonyme n'a été fourni.", "error");
    return;
  }

  try {
    const { data: sessionData, error: sessionError } =
      await supabase.auth.getSession();

    if (sessionError) throw sessionError;

    currentUser = sessionData.session?.user || null;

    const { data, error } = await supabase
      .from("profiles")
      .select("id, username, display_name")
      .ilike("username", requestedUsername)
      .maybeSingle();

    if (error) throw error;

    if (!data) {
      $("name").textContent = "Profil introuvable";
      $("username").textContent =
        "Vérifie le pseudonyme dans l'adresse.";
      $("stories").textContent = "";
      message("Aucun profil ne correspond à ce pseudonyme.", "error");
      return;
    }

    profile = data;

    $("name").textContent =
      profile.display_name || profile.username || "Lecteur Novelia";
    $("username").textContent = "@" + profile.username;
    $("avatar").textContent = initials(profile.display_name || profile.username);
    document.title = (profile.display_name || profile.username) + " — Novelia";
    try {
      const { data: amb } = await supabase.from("ambassadors").select("user_id").eq("user_id", profile.id).maybeSingle();
      $("ambassador").hidden = !amb;
    } catch (e) { /* table absente : pas de badge */ }
    try {
      const { data: ex, error: exError } = await supabase.from("profiles").select("avatar_url, bio").eq("id", profile.id).maybeSingle();
      if (!exError && ex) {
        if (ex.bio) { $("bio").textContent = ex.bio; $("bio").hidden = false; }
        if (/^https?:\/\//i.test(ex.avatar_url || "")) {
          const img = document.createElement("img");
          img.alt = "";
          img.addEventListener("error", () => { $("avatar").textContent = initials(profile.display_name || profile.username); });
          img.src = ex.avatar_url;
          $("avatar").replaceChildren(img);
        }
      }
    } catch (e) { /* colonnes pas encore activées */ }

    const [followersResult, followingResult, storiesResult] =
      await Promise.all([
        supabase.from("follows")
          .select("follower_id", { count: "exact", head: true })
          .eq("followed_id", profile.id),

        supabase.from("follows")
          .select("followed_id", { count: "exact", head: true })
          .eq("follower_id", profile.id),

        supabase.from("stories")
          .select("id, title, description, genre, story_type, cover_url")
          .eq("author_id", profile.id)
          .eq("status", "published")
          .or("moderation_hidden.is.null,moderation_hidden.eq.false")
          .order("created_at", { ascending: false })
      ]);

    if (followersResult.error || followingResult.error) {
      $("statFollowers").textContent = "–";
      $("statFollowing").textContent = "–";
    } else {
      $("statFollowers").textContent = followersResult.count ?? 0;
      $("statFollowing").textContent = followingResult.count ?? 0;
    }

    if (storiesResult.error) {
      $("stories").textContent =
        "Impossible de charger les histoires.";
      $("statWorks").textContent = "–";
    } else {
      $("statWorks").textContent = storiesResult.data.length;
      renderStories(storiesResult.data);
    }

    await refreshFollowButton();

  } catch (error) {
    console.error("Erreur de chargement du profil :", error);
    $("name").textContent = "Chargement impossible";
    $("username").textContent =
      "Vérifie ta connexion puis réessaie.";
    message(
      "Erreur : " + (error.message || "problème inattendu."),
      "error"
    );
  }
}

$("followButton").addEventListener("click", async () => {
  if (loadingAction || !profile) return;

  if (!currentUser) {
    location.href = "login.html";
    return;
  }

  if (currentUser.id === profile.id) {
    message("Tu ne peux pas t'abonner à ton propre profil.", "error");
    return;
  }

  loadingAction = true;
  const button = $("followButton");
  button.disabled = true;
  message("Enregistrement de ton choix...");

  try {
    let result;

    if (following) {
      result = await supabase
        .from("follows")
        .delete()
        .eq("follower_id", currentUser.id)
        .eq("followed_id", profile.id);
    } else {
      result = await supabase
        .from("follows")
        .insert({
          follower_id: currentUser.id,
          followed_id: profile.id
        });
    }

    if (result.error) throw result.error;

    message(
      following
        ? "Tu ne suis plus cet auteur."
        : "Tu suis maintenant cet auteur.",
      "success"
    );

    // Recharge l'état et les compteurs sans recharger toute la page.
    following = !following;
    await refreshFollowButton();

    const { count, error } = await supabase
      .from("follows")
      .select("follower_id", { count: "exact", head: true })
      .eq("followed_id", profile.id);

    if (!error) {
      $("statFollowers").textContent = count ?? 0;
    }

  } catch (error) {
    console.error("Erreur d'abonnement :", error);
    message(
      "Impossible d'enregistrer l'abonnement : " +
      (error.message || "erreur inconnue."),
      "error"
    );
  } finally {
    loadingAction = false;
    button.disabled = false;
  }
});

loadPage();
</script>
<script src="bottom-nav.js" defer></script>
</body>
</html>
