
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profil public — Novelia</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: #100d19;
      color: #f5f1ff;
      font-family: Arial, sans-serif;
    }
    main { max-width: 650px; margin: 25px auto; }
    .panel, .story {
      background: #1c1729;
      border: 1px solid #382b50;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 16px;
    }
    h1, h2 { color: #c5a3ff; }
    .muted { color: #c5bdd6; }
    button, .link {
      display: inline-block;
      padding: 11px 16px;
      border: 0;
      border-radius: 9px;
      background: #9b6bff;
      color: white;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    .story h3 { margin-top: 0; }
    #status { overflow-wrap: anywhere; }
    .error { color: #ffaaaa; }
    .success { color: #a9efbd; }
  </style>
</head>
<body>
<main>
  <a class="link" href="index.html">← Accueil Novelia</a>

  <section class="panel">
    <h1 id="name">Profil public</h1>
    <p id="username" class="muted">Chargement...</p>
    <p class="muted">Les adresses e-mail restent privées.</p>
    <p id="counts" class="muted"></p>

    <button id="followButton" type="button" hidden>
      S'abonner
    </button>
    <p id="status" role="status" aria-live="polite"></p>
  </section>

  <section>
    <h2>Histoires publiées</h2>
    <div id="stories">
      <p class="muted">Chargement des histoires...</p>
    </div>
  </section>
</main>

<script type="module">
import { createClient } from
  "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const supabase = createClient(
  "https://czwaokqpqgrghxeeyguq.supabase.co",
  "sb_publishable_ORoXM7DSfxdLF0jz8JRqqA_SISXCNsg"
);

const $ = id => document.getElementById(id);

const params = new URLSearchParams(location.search);
const requestedUsername = (params.get("username") || "")
  .trim().replace(/^@/, "");

let profile = null;
let currentUser = null;
let following = false;
let loadingAction = false;

function message(text, type = "") {
  $("status").textContent = text;
  $("status").className = type;
}

function renderStories(stories) {
  const container = $("stories");
  container.replaceChildren();

  if (!stories || stories.length === 0) {
    container.textContent =
      "Cet auteur n'a pas encore publié d'histoire.";
    return;
  }

  stories.forEach(story => {
    const card = document.createElement("article");
    card.className = "story";

    const title = document.createElement("h3");
    title.textContent = story.title || "Sans titre";

    const genre = document.createElement("p");
    genre.className = "muted";
    genre.textContent =
      (story.story_type === "webtoon" ? "Webtoon" : "Roman") +
      " · " + (story.genre || "Autre");

    const description = document.createElement("p");
    description.textContent = story.description || "";

    card.append(title, genre, description);
    container.append(card);
  });
}

async function refreshFollowButton() {
  if (!profile) return;

  const button = $("followButton");

  // Profil personnel : impossible de s'abonner à soi-même.
  if (currentUser && currentUser.id === profile.id) {
    button.hidden = true;
    message("C'est ton propre profil.", "");
    return;
  }

  // Visiteur non connecté : proposer la connexion.
  button.hidden = false;

  if (!currentUser) {
    following = false;
    button.textContent = "Se connecter pour suivre";
    message("Connecte-toi pour t'abonner à cet auteur.");
    return;
  }

  button.textContent = "Vérification...";
  button.disabled = true;

  const { data, error } = await supabase
    .from("follows")
    .select("follower_id")
    .eq("follower_id", currentUser.id)
    .eq("followed_id", profile.id)
    .maybeSingle();

  button.disabled = false;

  if (error) {
    button.textContent = "Réessayer";
    message(
      "Impossible de vérifier l'abonnement : " + error.message,
      "error"
    );
    return;
  }

  following = Boolean(data);
  button.textContent = following ? "Se désabonner" : "S'abonner";
  message("");
}

async function loadPage() {
  $("followButton").hidden = true;
  message("Chargement du profil...");

  if (!requestedUsername) {
    $("name").textContent = "Profil introuvable";
    $("username").textContent =
      "Adresse incomplète : ajoute ?username=pseudonyme à l'URL.";
    $("stories").textContent = "";
    message("Aucun pseudonyme n'a été fourni.", "error");
    return;
  }

  try {
    const { data: sessionData, error: sessionError } =
      await supabase.auth.getSession();

    if (sessionError) throw sessionError;

    currentUser = sessionData.session?.user || null;

    const { data, error } = await supabase
      .from("profiles")
      .select("id, username, display_name")
      .ilike("username", requestedUsername)
      .maybeSingle();

    if (error) throw error;

    if (!data) {
      $("name").textContent = "Profil introuvable";
      $("username").textContent =
        "Vérifie le pseudonyme dans l'adresse.";
      $("counts").textContent = "";
      $("stories").textContent = "";
      message("Aucun profil ne correspond à ce pseudonyme.", "error");
      return;
    }

    profile = data;

    $("name").textContent =
      profile.display_name || profile.username || "Lecteur Novelia";
    $("username").textContent = "@" + profile.username;

    const [followersResult, followingResult, storiesResult] =
      await Promise.all([
        supabase.from("follows")
          .select("follower_id", { count: "exact", head: true })
          .eq("followed_id", profile.id),

        supabase.from("follows")
          .select("followed_id", { count: "exact", head: true })
          .eq("follower_id", profile.id),

        supabase.from("stories")
          .select("id, title, description, genre, story_type")
          .eq("author_id", profile.id)
          .eq("status", "published")
          .order("created_at", { ascending: false })
      ]);

    if (followersResult.error || followingResult.error) {
      $("counts").textContent =
        "Les compteurs d'abonnements sont indisponibles.";
    } else {
      $("counts").textContent =
        (followersResult.count ?? 0) + " abonné(s) · " +
        (followingResult.count ?? 0) + " abonnement(s)";
    }

    if (storiesResult.error) {
      $("stories").textContent =
        "Impossible de charger les histoires.";
    } else {
      renderStories(storiesResult.data);
    }

    await refreshFollowButton();

  } catch (error) {
    console.error("Erreur de chargement du profil :", error);
    $("name").textContent = "Chargement impossible";
    $("username").textContent =
      "Vérifie ta connexion puis réessaie.";
    message(
      "Erreur : " + (error.message || "problème inattendu."),
      "error"
    );
  }
}

$("followButton").addEventListener("click", async () => {
  if (loadingAction || !profile) return;

  if (!currentUser) {
    location.href = "login.html";
    return;
  }

  if (currentUser.id === profile.id) {
    message("Tu ne peux pas t'abonner à ton propre profil.", "error");
    return;
  }

  loadingAction = true;
  const button = $("followButton");
  button.disabled = true;
  message("Enregistrement de ton choix...");

  try {
    let result;

    if (following) {
      result = await supabase
        .from("follows")
        .delete()
        .eq("follower_id", currentUser.id)
        .eq("followed_id", profile.id);
    } else {
      result = await supabase
        .from("follows")
        .insert({
          follower_id: currentUser.id,
          followed_id: profile.id
        });
    }

    if (result.error) throw result.error;

    message(
      following
        ? "Tu ne suis plus cet auteur."
        : "Tu suis maintenant cet auteur.",
      "success"
    );

    // Recharge l'état et les compteurs sans recharger toute la page.
    following = !following;
    await refreshFollowButton();

    const { count, error } = await supabase
      .from("follows")
      .select("follower_id", { count: "exact", head: true })
      .eq("followed_id", profile.id);

    if (!error) {
      const oldText = $("counts").textContent;
      const match = oldText.match(/·\s*(\d+)\s*abonnement/);
      const followingCount = match ? match[1] : "0";
      $("counts").textContent =
        (count ?? 0) + " abonné(s) · " +
        followingCount + " abonnement(s)";
    }

  } catch (error) {
    console.error("Erreur d'abonnement :", error);
    message(
      "Impossible d'enregistrer l'abonnement : " +
      (error.message || "erreur inconnue."),
      "error"
    );
  } finally {
    loadingAction = false;
    button.disabled = false;
  }
});

loadPage();
</script>
</body>
</html>
