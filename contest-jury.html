<script type="module">
import{createClient}from"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.109.0/+esm";
const db=createClient("https://czwaokqpqgrghxeeyguq.supabase.co","sb_publishable_ORoXM7DSfxdLF0jz8JRqqA_SISXCNsg"),$=id=>document.getElementById(id),el=(t,c,x)=>{const n=document.createElement(t);if(c)n.className=c;if(x!==undefined)n.textContent=x;return n;};
async function init(){const user=(await db.auth.getUser()).data?.user;if(!user){$("status").textContent="Connectez-vous pour accéder à vos missions de jury.";return;}const {data:assigned,error}=await db.from("novelia_contest_jurors").select("contest_id,novelia_contests(id,title,theme,status)").eq("juror_id",user.id);if(error){$("status").textContent="Impossible de charger vos affectations.";return;}const root=$("assignments");root.replaceChildren();if(!assigned?.length){$("status").textContent="Aucune affectation pour le moment.";return;}$("status").textContent=assigned.length+" concours attribué(s).";for(const a of assigned){const contest=a.novelia_contests;if(!contest)continue;const card=el("section","card");card.append(el("h2","",contest.title),el("p","muted",contest.theme+" · "+contest.status));if(!["judging","voting"].includes(contest.status)){card.append(el("p","muted","Les évaluations seront ouvertes lorsque l’organisateur lancera la phase de jugement."));root.append(card);continue;}const {data:entries}=await db.from("novelia_contest_entries").select("id,author_id,pitch,excerpt,stories(title,description,genre)").eq("contest_id",contest.id).eq("status","approved").neq("author_id",user.id);if(!entries?.length)card.append(el("p","muted","Aucune œuvre approuvée à évaluer."));for(const entry of entries||[]){const block=el("article","card"),story=entry.stories||{};block.append(el("h3","",story.title||"Œuvre"),el("p","muted",story.genre||"Genre non précisé"),el("p","",entry.pitch||story.description||""));const form=el("form",""),fields=[["originality","Originalité"],["writing_style","Qualité de l’écriture"],["coherence","Cohérence"],["theme_respect","Respect du thème"]],grid=el("div","scores");for(const [key,label] of fields){const wrap=el("div","score"),lab=el("label","",label),sel=el("select","");sel.name=key;sel.required=true;sel.add(new Option("Note /10",""));for(let n=1;n<=10;n++)sel.add(new Option(String(n)+"/10",String(n)));wrap.append(lab,sel);grid.append(wrap);}const feedback=el("textarea","");feedback.name="feedback";feedback.maxLength=2000;feedback.placeholder="Commentaire du jury (facultatif, privé)…";const save=el("button","","Enregistrer l’évaluation"),msg=el("p","muted",""),field=el("div","field");field.append(feedback);form.append(grid,field,save,msg);form.onsubmit=async ev=>{ev.preventDefault();save.disabled=true;const values=Object.fromEntries(new FormData(form));const payload={contest_id:contest.id,entry_id:entry.id,juror_id:user.id,originality:Number(values.originality),writing_style:Number(values.writing_style),coherence:Number(values.coherence),theme_respect:Number(values.theme_respect),feedback:String(values.feedback||"")};const result=await db.from("novelia_contest_reviews").upsert(payload,{onConflict:"entry_id,juror_id"});save.disabled=false;msg.textContent=result.error?"Enregistrement impossible : "+result.error.message:"Évaluation enregistrée.";};const existing=await db.from("novelia_contest_reviews").select("originality,writing_style,coherence,theme_respect,feedback").eq("entry_id",entry.id).eq("juror_id",user.id).maybeSingle();if(existing.data){for(const [k,v] of Object.entries(existing.data)){if(form.elements[k])form.elements[k].value=v;}}block.append(form);card.append(block);}root.append(card);}}
