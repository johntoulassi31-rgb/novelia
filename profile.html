
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon profil — Novelia</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px;
      background: #fbf8f1;
      color: #392b08;
      font-family: Arial, sans-serif;
    }
    .container {
      width: 100%;
      max-width: 520px;
      margin: 30px auto;
      padding: 26px;
      background: #f8f3e6;
      border: 1px solid #f0e6cd;
      border-radius: 18px;
    }
    h1 { color: #7d5f12; margin-top: 0; }
    p { color: #675937; line-height: 1.5; }
    label {
      display: block;
      margin: 18px 0 7px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      border: 1px solid #ede0c1;
      background: #fbf8f1;
      color: #2a2011;
      font-size: 16px;
    }
    button, .link {
      display: inline-block;
      margin-top: 18px;
      padding: 12px 16px;
      border: 0;
      border-radius: 9px;
      background: #ae8419;
      color: #1f1b14;
      font-weight: bold;
      font-size: 15px;
      text-decoration: none;
      cursor: pointer;
    }
    .secondary { background: #f0e6cd; }
    #status { margin-top: 16px; overflow-wrap: anywhere; }
    .email { overflow-wrap: anywhere; }
      a{color:#9a7414}
    textarea{width:100%;padding:12px;border:1px solid #d9c98f;border-radius:10px;background:#fff;color:#2a2011;font:16px Arial,sans-serif;resize:vertical}
    .avatar-row{display:flex;gap:12px;align-items:center}
    #avatarPreview{border-radius:50%;object-fit:cover}
    #avatarPreview[hidden]{display:none}
    .hint{font-size:13px;opacity:.8;margin:6px 0 0}
  </style>
<link rel="stylesheet" href="theme-gold.css">
</head>
<body>
  <main class="container">
    <h1>Mon profil</h1>
    <p>Personnalise ton identité sur Novelia.</p>

    <p class="email">
      <strong>Adresse e-mail :</strong>
      <span id="email">Chargement...</span>
    </p>

    <form id="profileForm">
      <label for="username">Pseudonyme unique</label>
      <input
        id="username"
        type="text"
        minlength="3"
        maxlength="24"
        pattern="[A-Za-z0-9_]+"
        placeholder="Ex. PlumeObsidienne"
        required
      >

      <label for="displayName">Nom affiché</label>
      <input
        id="displayName"
        type="text"
        maxlength="50"
        placeholder="Le nom visible sur ton profil"
      >

      <label for="bio">Biographie (facultatif)</label>
      <textarea id="bio" maxlength="300" rows="4" placeholder="Parle un peu de toi, de ce que tu écris ou lis…"></textarea>

      <label for="avatarFile">Photo de profil (facultatif)</label>
      <div class="avatar-row">
        <img id="avatarPreview" alt="Ta photo de profil" width="72" height="72" hidden>
        <input id="avatarFile" type="file" accept="image/jpeg,image/png,image/webp">
      </div>
      <p class="hint">L'image est réduite automatiquement avant l'envoi. Formats : JPG, PNG ou WebP.</p>

      <button type="submit" id="saveButton">
        Enregistrer mon profil
      </button>
    </form>

    <p id="status" role="status"></p>

    <a class="link secondary" href="index.html">Retour à Novelia</a>
    <button class="secondary" id="logoutButton" type="button">
      Se déconnecter
    </button>
    <button class="secondary" id="deleteAccountButton" type="button" style="background:#f0e5cc">
      Demander la suppression de mon compte
    </button>
    <p><a href="suppression-compte.html">En savoir plus sur la suppression du compte</a></p>
  </main>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.109.0/+esm";

    const SUPABASE_URL =
      "https://czwaokqpqgrghxeeyguq.supabase.co";
    const SUPABASE_KEY =
      "sb_publishable_ORoXM7DSfxdLF0jz8JRqqA_SISXCNsg";

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const emailEl = document.getElementById("email");
    const usernameEl = document.getElementById("username");
    const displayNameEl = document.getElementById("displayName");
    const statusEl = document.getElementById("status");
    const saveButton = document.getElementById("saveButton");
    const bioEl = document.getElementById("bio");
    const avatarFile = document.getElementById("avatarFile");
    const avatarPreview = document.getElementById("avatarPreview");

    let currentUser = null;
    let currentAvatar = "";

    function showAvatar(url) {
      if (/^https?:\/\//i.test(url || "")) { avatarPreview.src = url; avatarPreview.hidden = false; }
      else { avatarPreview.hidden = true; }
    }

    avatarFile.addEventListener("change", () => {
      const f = avatarFile.files[0];
      if (f) { avatarPreview.src = URL.createObjectURL(f); avatarPreview.hidden = false; }
    });

    // Recadre en carré 320x320 et compresse en JPEG avant l'envoi
    async function resizeAvatar(file) {
      const bmp = await createImageBitmap(file);
      const size = Math.min(bmp.width, bmp.height);
      const canvas = document.createElement("canvas");
      canvas.width = 320; canvas.height = 320;
      canvas.getContext("2d").drawImage(bmp, (bmp.width - size) / 2, (bmp.height - size) / 2, size, size, 0, 0, 320, 320);
      return await new Promise((resolve, reject) =>
        canvas.toBlob(b => b ? resolve(b) : reject(new Error("Image illisible.")), "image/jpeg", 0.85));
    }

    async function uploadAvatar(file) {
      if (!/^image\/(jpeg|png|webp)$/.test(file.type)) throw new Error("Format non pris en charge (JPG, PNG ou WebP).");
      if (file.size > 10 * 1024 * 1024) throw new Error("Image trop lourde (10 Mo maximum).");
      const blob = await resizeAvatar(file);
      const path = currentUser.id + "/" + Date.now() + ".jpg";
      const up = await supabase.storage.from("avatars").upload(path, blob, { contentType: "image/jpeg" });
      if (up.error) throw up.error;
      return supabase.storage.from("avatars").getPublicUrl(path).data.publicUrl;
    }

    async function loadProfile() {
      statusEl.textContent = "Chargement du profil...";

      const { data: { user }, error: authError } =
        await supabase.auth.getUser();

      if (authError || !user) {
        window.location.href = "login.html";
        return;
      }

      currentUser = user;
      emailEl.textContent = user.email || "Non renseignée";

      const { data, error } = await supabase
        .from("profiles")
        .select("username, display_name")
        .eq("id", user.id)
        .maybeSingle();

      if (error) {
        statusEl.textContent =
          "Impossible de charger le profil : " + error.message;
        return;
      }

      if (data) {
        usernameEl.value = data.username || "";
        displayNameEl.value = data.display_name || "";
      }

      try {
        const ex = await supabase.from("profiles").select("bio, avatar_url").eq("id", user.id).maybeSingle();
        if (!ex.error && ex.data) {
          bioEl.value = ex.data.bio || "";
          currentAvatar = ex.data.avatar_url || "";
          showAvatar(currentAvatar);
        }
      } catch (e) { /* colonnes pas encore activées */ }

      statusEl.textContent = "Profil chargé.";
    }

    document.getElementById("profileForm")
      .addEventListener("submit", async (event) => {
        event.preventDefault();

        if (!currentUser) return;

        const username = usernameEl.value.trim();
        const displayName = displayNameEl.value.trim();

        if (!/^[A-Za-z0-9_]{3,24}$/.test(username)) {
          statusEl.textContent =
            "Le pseudonyme doit contenir 3 à 24 caractères : lettres, chiffres ou _.";
          return;
        }

        saveButton.disabled = true;
        statusEl.textContent = "Enregistrement...";

        const { error } = await supabase
          .from("profiles")
          .upsert({
            id: currentUser.id,
            username: username,
            display_name: displayName || null
          }, { onConflict: "id" });

        saveButton.disabled = false;

        if (error) {
          if (error.code === "23505") {
            statusEl.textContent =
              "Ce pseudonyme est déjà utilisé. Choisis-en un autre.";
          } else {
            statusEl.textContent =
              "Erreur d'enregistrement : " + error.message;
          }
          return;
        }

        const extras = { bio: bioEl.value.trim() || null };
        const file = avatarFile.files[0];
        if (file) {
          try {
            statusEl.textContent = "Envoi de la photo...";
            extras.avatar_url = await uploadAvatar(file);
          } catch (e) {
            statusEl.textContent = "Profil enregistré, mais la photo n'a pas pu être envoyée : " + (e.message || "erreur");
            return;
          }
        }
        const ex = await supabase.from("profiles").update(extras).eq("id", currentUser.id);
        if (ex.error) {
          statusEl.textContent = "Profil enregistré, mais la biographie et la photo ne sont pas encore activées.";
          return;
        }
        if (extras.avatar_url) {
          const old = currentAvatar.split("/avatars/")[1];
          if (old) { try { await supabase.storage.from("avatars").remove([old]); } catch (e) {} }
          currentAvatar = extras.avatar_url;
          showAvatar(currentAvatar);
          avatarFile.value = "";
        }
        statusEl.textContent = "Profil enregistré avec succès.";
      });

    document.getElementById("logoutButton")
      .addEventListener("click", async () => {
        const { error } = await supabase.auth.signOut();

        if (error) {
          statusEl.textContent = "Erreur : " + error.message;
          return;
        }

        window.location.href = "login.html";
      });

    document.getElementById("deleteAccountButton")
      .addEventListener("click", () => {
        if (!currentUser) return;
        if (!confirm("Demander la suppression de ton compte et de tes données ? Un e-mail pré-rempli va s'ouvrir : envoie-le pour confirmer ta demande.")) return;
        const sujet = encodeURIComponent("Suppression de mon compte Novelia");
        const corps = encodeURIComponent(
          "Bonjour,\n\nJe demande la suppression de mon compte Novelia et de mes données personnelles.\n\n" +
          "E-mail du compte : " + (currentUser.email || "") + "\n" +
          "Identifiant : " + currentUser.id + "\n"
        );
        window.location.href = "mailto:Johntoulassi31@gmail.com?subject=" + sujet + "&body=" + corps;
      });

    loadProfile();
  </script>
<script src="bottom-nav.js" defer></script>
</body>
</html>
